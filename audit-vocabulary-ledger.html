<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Vocabulary Ledger ｜ 監査英単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Serif+JP:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141F2C;
    --ink2:#1D2C3D;
    --line-dark:rgba(242,239,230,0.14);
    --paper:#FBF8F1;
    --paper2:#F1EAD6;
    --line:#DCD2B4;
    --text:#1B2836;
    --text-soft:#5B6672;
    --text-on-ink:#F2EFE6;
    --text-on-ink-soft:#A9B4BF;
    --green:#1F6F4E;
    --green-bg:#E2EEE5;
    --red:#A6392F;
    --red-bg:#F5E3E0;
    --amber:#A97A1F;
    --amber-bg:#F4E9D2;
    --serif:'Source Serif 4','Noto Serif JP',serif;
    --sans:'Inter','Noto Sans JP',sans-serif;
    --mono:'IBM Plex Mono',monospace;
    --radius:5px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  #app{max-width:920px;margin:0 auto;padding:0 0 64px;}
  #loading{color:var(--text-on-ink-soft);text-align:center;padding:80px 20px;font-family:var(--mono);}

  /* ---------- Header ---------- */
  header.site{
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink2) 100%);
    padding:36px 24px 20px;
    animation:fadeDown .5s ease both;
  }
  @keyframes fadeDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
  .title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .title-en{font-family:var(--serif);font-weight:600;font-size:2.05rem;color:var(--text-on-ink);letter-spacing:.2px;}
  .title-ja{font-family:var(--serif);font-size:1.05rem;color:var(--text-on-ink-soft);}
  .subline{margin-top:6px;color:var(--text-on-ink-soft);font-size:.92rem;line-height:1.6;max-width:56ch;}
  .stat-line{margin-top:14px;font-family:var(--mono);font-size:.8rem;color:var(--text-on-ink-soft);display:flex;gap:18px;flex-wrap:wrap;}
  .stat-line b{color:var(--text-on-ink);font-weight:500;}

  nav.tabs{display:flex;gap:2px;margin-top:22px;flex-wrap:wrap;border-top:1px solid var(--line-dark);padding-top:14px;}
  nav.tabs button{
    background:transparent;border:1px solid transparent;color:var(--text-on-ink-soft);
    font-family:var(--sans);font-size:.88rem;padding:9px 14px;border-radius:4px 4px 0 0;
    cursor:pointer;display:flex;align-items:center;gap:8px;
  }
  nav.tabs button .idx{font-family:var(--mono);font-size:.75rem;color:var(--amber);border:1px solid currentColor;border-radius:3px;padding:0 5px;}
  nav.tabs button.active{background:var(--paper);color:var(--text);}
  nav.tabs button.active .idx{color:var(--green);}
  nav.tabs button:not(.active):hover{color:var(--text-on-ink);}

  /* ---------- Main panel ---------- */
  main{background:var(--paper);padding:28px 24px 40px;min-height:420px;}

  .controls-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:.8rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--text-soft);cursor:pointer;font-family:var(--sans);
  }
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--text-on-ink);}
  .toggle-inline{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text-soft);margin-left:auto;cursor:pointer;user-select:none;}
  .toggle-inline input{accent-color:var(--green);width:14px;height:14px;}
  input[type=text], select{
    font-family:var(--sans);font-size:.88rem;padding:8px 10px;border:1px solid var(--line);
    border-radius:4px;background:#fff;color:var(--text);
  }
  select{cursor:pointer;}

  /* ---------- Flashcard ---------- */
  .flash-wrap{display:flex;flex-direction:column;align-items:center;}
  .progress-mini{font-family:var(--mono);font-size:.78rem;color:var(--text-soft);margin-bottom:14px;}
  .card-scene{perspective:1400px;width:100%;max-width:560px;height:340px;}
  .card{
    position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .card-face{
    position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);
    border-radius:8px;background:#fff;padding:26px 28px;display:flex;flex-direction:column;
    box-shadow:2px 2px 0 var(--line);
  }
  .card-face.back{transform:rotateY(180deg);background:var(--paper2);overflow-y:auto;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .ref-no{font-family:var(--mono);font-size:.75rem;color:var(--text-soft);}
  .cat-tag{font-size:.72rem;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper);}
  .card-term{font-family:var(--serif);font-size:2rem;color:var(--text);text-align:center;margin:auto 0;line-height:1.25;}
  .card-pos{text-align:center;font-style:italic;color:var(--text-soft);font-size:.85rem;margin-top:2px;}
  .card-hint{text-align:center;color:var(--text-soft);font-size:.76rem;margin-top:auto;}
  .card-ja{font-family:var(--serif);font-size:1.7rem;color:var(--text);margin-bottom:10px;}
  .card-def{font-size:.92rem;color:var(--text);margin-bottom:12px;line-height:1.6;}
  .card-ex{border-left:3px solid var(--amber);padding:6px 12px;font-style:italic;font-size:.85rem;color:var(--ink2);background:#fff;margin-bottom:12px;}
  .card-note-label{font-size:.75rem;color:var(--text-soft);margin-bottom:3px;}
  .card-note{font-size:.86rem;line-height:1.65;color:var(--text);}

  .flash-controls{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;justify-content:center;}
  .btn{
    font-family:var(--sans);font-size:.85rem;padding:9px 16px;border-radius:4px;border:1px solid var(--line);
    background:#fff;color:var(--text);cursor:pointer;
  }
  .btn:hover{border-color:var(--ink2);}
  .btn.ghost{background:transparent;}
  .btn.mastered{border-color:var(--green);color:var(--green);}
  .btn.mastered:hover{background:var(--green-bg);}
  .btn.review{border-color:var(--red);color:var(--red);}
  .btn.review:hover{background:var(--red-bg);}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--text-on-ink);}
  .btn.primary:hover{background:var(--ink2);}
  .btn:disabled{opacity:.4;cursor:default;}
  .empty-note{color:var(--text-soft);text-align:center;padding:60px 10px;font-size:.9rem;}

  /* ---------- Quiz ---------- */
  .quiz-setup{max-width:480px;margin:20px auto;display:flex;flex-direction:column;gap:14px;}
  .quiz-setup label{font-size:.82rem;color:var(--text-soft);display:flex;flex-direction:column;gap:5px;}
  .quiz-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:.8rem;color:var(--text-soft);margin-bottom:16px;}
  .quiz-term{font-family:var(--serif);font-size:1.9rem;text-align:center;margin:22px 0 26px;}
  .quiz-options{display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto;}
  .opt-btn{
    text-align:left;padding:12px 16px;border:1px solid var(--line);border-radius:5px;background:#fff;
    font-family:var(--sans);font-size:.94rem;cursor:pointer;color:var(--text);
  }
  .opt-btn:hover:not(:disabled){border-color:var(--ink2);}
  .opt-btn.correct{border-color:var(--green);background:var(--green-bg);}
  .opt-btn.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt-btn:disabled{cursor:default;}
  .quiz-feedback{max-width:520px;margin:18px auto 0;padding:14px 16px;border-radius:5px;font-size:.86rem;line-height:1.6;}
  .quiz-feedback.ok{background:var(--green-bg);color:#184a35;}
  .quiz-feedback.no{background:var(--red-bg);color:#6d2a23;}
  .quiz-next{display:flex;justify-content:center;margin-top:18px;}
  .quiz-result{max-width:560px;margin:10px auto;text-align:center;}
  .quiz-score{font-family:var(--serif);font-size:2.6rem;margin:14px 0 4px;}
  .miss-list{text-align:left;margin-top:22px;border-top:1px solid var(--line);padding-top:14px;}
  .miss-item{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.87rem;}
  .miss-item b{font-family:var(--serif);}
  .result-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

  /* ---------- List ---------- */
  .list-search{width:100%;max-width:320px;}
  .word-row{border-bottom:1px solid var(--line);}
  .word-row-head{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;}
  .w-no{font-family:var(--mono);font-size:.75rem;color:var(--text-soft);width:38px;flex-shrink:0;}
  .w-term{font-family:var(--serif);font-size:1.05rem;flex:1;min-width:140px;}
  .w-ja{color:var(--text-soft);font-size:.9rem;flex:1;min-width:120px;}
  .w-tick{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.78rem;color:transparent;}
  .w-tick.on{background:var(--green);border-color:var(--green);color:#fff;}
  .word-row-body{display:none;padding:0 4px 16px 50px;}
  .word-row.open .word-row-body{display:block;}
  .word-row.open .word-row-head{background:var(--paper2);}

  /* ---------- Progress ---------- */
  .prog-top{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:28px;}
  .prog-big{font-family:var(--serif);font-size:3rem;}
  .prog-big small{font-size:1rem;color:var(--text-soft);font-family:var(--sans);}
  .bar-track{background:var(--paper2);border-radius:4px;height:10px;overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;background:var(--green);transition:width .8s ease;}
  .cat-prog-row{margin-bottom:14px;}
  .cat-prog-label{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:5px;color:var(--text);}
  .cat-prog-label span:last-child{font-family:var(--mono);color:var(--text-soft);}
  .stat-cards{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px;}
  .stat-card{flex:1;min-width:140px;border:1px solid var(--line);border-radius:6px;padding:14px 16px;background:#fff;}
  .stat-card .num{font-family:var(--serif);font-size:1.7rem;}
  .stat-card .lbl{font-size:.78rem;color:var(--text-soft);margin-top:2px;}
  .reset-zone{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);}

  footer.note{max-width:920px;margin:0 auto;padding:18px 24px 40px;color:var(--text-on-ink-soft);font-size:.76rem;line-height:1.7;}

  @media(max-width:600px){
    header.site{padding:26px 16px 16px;}
    main{padding:22px 16px 32px;}
    .title-en{font-size:1.6rem;}
    .card-scene{height:380px;}
    .card-term{font-size:1.5rem;}
    .w-ja{display:none;}
  }
</style>
</head>
<body>

<script>
/* =========================================================
   単語データ
========================================================= */
const CATS = {
  opinion:"監査意見・監査報告書",
  process:"監査手続",
  risk:"リスク・重要性",
  assertion:"監査要点(アサーション)",
  fs:"財務諸表・会計概念",
  control:"内部統制",
  ethics:"職業倫理・監査基準"
};

const WORDS = [
{id:1,term:"audit opinion",pos:"noun",cat:"opinion",ja:"監査意見",def:"The auditor's formal conclusion on whether the financial statements are fairly presented.",ex:"The audit opinion is included in the final section of the report.",note:"監査人が財務諸表に対して表明する結論。監査報告書の中心となる記述。"},
{id:2,term:"unqualified opinion",pos:"noun",cat:"opinion",ja:"無限定適正意見",def:"An opinion stating the financial statements are presented fairly in all material respects, with no exceptions.",ex:"The company received an unqualified opinion for the third consecutive year.",note:"重要な点においてすべて適正に表示されていると判断した場合に出す、最も望ましい意見。"},
{id:3,term:"qualified opinion",pos:"noun",cat:"opinion",ja:"限定付適正意見",def:"An opinion stating the financial statements are fairly presented except for a specific matter.",ex:"Due to an unresolved inventory issue, the auditor issued a qualified opinion.",note:"一部の項目を除き適正であるとする意見。重要だが広範ではない虚偽表示や監査範囲の制約がある場合に出される。"},
{id:4,term:"adverse opinion",pos:"noun",cat:"opinion",ja:"不適正意見",def:"An opinion stating the financial statements do not present fairly, taken as a whole.",ex:"The adverse opinion reflected widespread and material misstatements.",note:"財務諸表全体が適正に表示されていないと判断した場合に出す、最も厳しい意見。"},
{id:5,term:"disclaimer of opinion",pos:"noun",cat:"opinion",ja:"意見不表明",def:"A statement that the auditor is unable to express an opinion due to insufficient evidence.",ex:"The auditor issued a disclaimer of opinion because management restricted access to key records.",note:"十分かつ適切な監査証拠を入手できず、意見を表明できない場合に出す結論。"},
{id:6,term:"going concern",pos:"noun phrase",cat:"opinion",ja:"継続企業の前提",def:"The assumption that an entity will continue operating for the foreseeable future.",ex:"The auditor identified substantial doubt about the company's going concern.",note:"企業が将来にわたって事業を継続できるという前提。重要な疑義がある場合は監査報告書に記載が必要。"},
{id:7,term:"emphasis of matter paragraph",pos:"noun phrase",cat:"opinion",ja:"強調事項区分",def:"A paragraph added to the audit report to draw attention to a matter appropriately presented in the financial statements.",ex:"An emphasis of matter paragraph was added regarding the pending litigation.",note:"意見に影響を与えないが、財務諸表利用者の理解のために特に強調すべき事項を記載する区分。"},
{id:8,term:"other matter paragraph",pos:"noun phrase",cat:"opinion",ja:"その他の事項区分",def:"A paragraph referring to a matter not presented in the financial statements but relevant to understanding the audit.",ex:"The other matter paragraph explained the scope limitation from the prior year.",note:"財務諸表には記載されていないが、監査や監査人の責任等の理解に関連する事項を説明する区分。"},
{id:9,term:"key audit matters (KAM)",pos:"noun phrase",cat:"opinion",ja:"監査上の主要な検討事項",def:"Matters that, in the auditor's professional judgment, were of most significance in the audit.",ex:"Revenue recognition was identified as a key audit matter.",note:"職業的専門家として当年度の監査において特に重要であると判断した事項。監査報告書に個別に記載される。"},
{id:10,term:"audit report",pos:"noun",cat:"opinion",ja:"監査報告書",def:"The formal written document containing the auditor's opinion on the financial statements.",ex:"The audit report was signed and dated as of the completion of fieldwork.",note:"監査の結果として監査人が作成する正式な報告書。意見の種類や根拠などが記載される。"},
{id:11,term:"management representation letter",pos:"noun phrase",cat:"opinion",ja:"経営者確認書",def:"A letter from management confirming representations made during the audit.",ex:"The management representation letter was obtained before the report was issued.",note:"監査終了時に経営者が監査人に対し、財務諸表の作成責任や開示の完全性などを文書で確認するもの。"},
{id:12,term:"predecessor auditor",pos:"noun",cat:"opinion",ja:"前任監査人",def:"The auditor who audited the entity's financial statements in a prior period and has been replaced.",ex:"The successor auditor contacted the predecessor auditor before accepting the engagement.",note:"前年度まで監査を担当していた監査人。監査人交代時には引継のための連絡を行うことが求められる。"},

{id:13,term:"substantive procedures",pos:"noun phrase",cat:"process",ja:"実証手続",def:"Audit procedures designed to detect material misstatements at the assertion level.",ex:"Substantive procedures included recalculating depreciation expense.",note:"財務諸表の金額や開示に重要な虚偽表示がないかを直接確かめるための手続。"},
{id:14,term:"test of controls",pos:"noun phrase",cat:"process",ja:"統制のテスト",def:"Procedures performed to evaluate the operating effectiveness of internal controls.",ex:"The auditor performed a test of controls over the purchasing process.",note:"内部統制が実際に有効に運用されているかを確かめる手続。"},
{id:15,term:"analytical procedures",pos:"noun phrase",cat:"process",ja:"分析的手続",def:"Evaluations of financial information through analysis of plausible relationships among data.",ex:"Analytical procedures revealed an unusual fluctuation in gross margin.",note:"財務データ間の関係や趨勢を分析し、異常な変動や矛盾がないかを検討する手続。"},
{id:16,term:"inquiry",pos:"noun",cat:"process",ja:"質問",def:"Seeking information from knowledgeable persons within or outside the entity.",ex:"Inquiry of the credit manager helped assess the allowance for doubtful accounts.",note:"経営者や従業員などに口頭または書面で質問し、情報を入手する監査手続。"},
{id:17,term:"inspection",pos:"noun",cat:"process",ja:"閲覧・査閲",def:"Examining records, documents, or physical assets.",ex:"Inspection of the purchase invoices confirmed the recorded amounts.",note:"記録、文書または有形資産を実際に確認する手続。"},
{id:18,term:"observation",pos:"noun",cat:"process",ja:"立会",def:"Watching a process or procedure being performed by others.",ex:"The auditor's observation of the physical inventory count took place on December 31.",note:"他者が実施しているプロセスや手続を監査人自らその場で見て確かめる手続。棚卸立会などが代表例。"},
{id:19,term:"external confirmation",pos:"noun phrase",cat:"process",ja:"外部確認",def:"Audit evidence obtained directly from a third party in response to a request.",ex:"External confirmation of the bank balance was received directly from the bank.",note:"監査人が第三者に対して直接照会し、書面などで回答を得る手続。銀行確認状が代表例。"},
{id:20,term:"recalculation",pos:"noun",cat:"process",ja:"再計算",def:"Checking the mathematical accuracy of documents or records.",ex:"Recalculation of the depreciation schedule confirmed no errors.",note:"会社が作成した計算の正確性を監査人自らが計算し直して確かめる手続。"},
{id:21,term:"reperformance",pos:"noun",cat:"process",ja:"再実施",def:"The auditor's independent execution of procedures or controls originally performed by the entity.",ex:"Reperformance of the bank reconciliation matched the client's results.",note:"会社が実施した手続や統制を、監査人が自ら独立して再度実施して確かめる手続。"},
{id:22,term:"vouching",pos:"noun",cat:"process",ja:"突合",def:"Tracing recorded transactions back to supporting documents to verify existence and accuracy.",ex:"Vouching the sales entries to shipping documents supported the occurrence assertion.",note:"記録された取引について、その根拠となる原始証憑まで遡って確認する手続。"},
{id:23,term:"tracing",pos:"noun",cat:"process",ja:"トレーシング",def:"Following a transaction forward from its source document into the accounting records.",ex:"Tracing the shipping documents to the sales ledger tested completeness.",note:"原始証憑から会計記録へ順方向に追跡し、記録の網羅性を確かめる手続。"},
{id:24,term:"walkthrough",pos:"noun",cat:"process",ja:"ウォークスルー",def:"Following a transaction through the accounting system from origination to reporting.",ex:"A walkthrough of the purchasing cycle helped the auditor understand the relevant controls.",note:"一つの取引を発生から財務諸表への反映まで実際にたどり、業務プロセスと統制を理解する手続。"},
{id:25,term:"sampling",pos:"noun",cat:"process",ja:"サンプリング",def:"Selecting less than 100% of a population for testing to draw a conclusion about the whole.",ex:"Sampling was used to select 40 invoices for testing out of 2,000.",note:"母集団の一部を抽出して検討し、母集団全体についての結論を導く方法。"},
{id:26,term:"cut-off",pos:"noun",cat:"process",ja:"期間帰属",def:"The principle that transactions are recorded in the correct accounting period.",ex:"Cut-off testing confirmed that December shipments were recorded in the correct year.",note:"取引が正しい会計期間に記録されているかという論点、およびそれを確かめる手続。"},
{id:27,term:"roll-forward",pos:"noun",cat:"process",ja:"ロールフォワード",def:"Updating audit procedures performed at an interim date to the balance sheet date.",ex:"The auditor rolled forward the interim testing results to year-end.",note:"期中に実施した監査手続の結果を期末日まで更新し、残りの期間の変動を検討する手続。"},
{id:28,term:"audit evidence",pos:"noun phrase",cat:"process",ja:"監査証拠",def:"Information used by the auditor to arrive at the conclusions on which the opinion is based.",ex:"Sufficient and appropriate audit evidence supports the audit opinion.",note:"監査人が意見の基礎となる結論を導くために利用する情報全般。"},
{id:29,term:"audit trail",pos:"noun phrase",cat:"process",ja:"監査証跡",def:"A chronological record that traces transactions from source to final entry.",ex:"The audit trail allowed the auditor to follow the transaction from the invoice to the general ledger.",note:"取引が発生から記帳、財務諸表への反映に至るまでを追跡できる記録の連鎖。"},

{id:30,term:"audit risk",pos:"noun phrase",cat:"risk",ja:"監査リスク",def:"The risk that the auditor expresses an inappropriate opinion on materially misstated financial statements.",ex:"Audit risk is a function of the risk of material misstatement and detection risk.",note:"財務諸表に重要な虚偽表示があるにもかかわらず、監査人が誤った意見を表明してしまうリスク。"},
{id:31,term:"inherent risk",pos:"noun phrase",cat:"risk",ja:"固有リスク",def:"The susceptibility of an assertion to misstatement before considering related controls.",ex:"Inherent risk is higher for accounts involving significant estimates.",note:"内部統制の存在を考慮する前の、勘定科目やアサーションが本来的に持つ虚偽表示のリスク。"},
{id:32,term:"control risk",pos:"noun phrase",cat:"risk",ja:"統制リスク",def:"The risk that a misstatement will not be prevented or detected by internal control on a timely basis.",ex:"Control risk was assessed as low due to strong segregation of duties.",note:"内部統制によって虚偽表示が適時に防止または発見されないリスク。"},
{id:33,term:"detection risk",pos:"noun phrase",cat:"risk",ja:"発見リスク",def:"The risk that the auditor's procedures will not detect a misstatement that exists.",ex:"The auditor reduced detection risk by increasing the sample size.",note:"監査人が実施する手続によって、存在する虚偽表示を発見できないリスク。"},
{id:34,term:"materiality",pos:"noun",cat:"risk",ja:"重要性",def:"The magnitude of an omission or misstatement that could influence users' decisions.",ex:"Materiality was set at 5% of pre-tax income.",note:"財務諸表利用者の意思決定に影響を与える可能性のある虚偽表示の重要度。監査計画の基礎となる。"},
{id:35,term:"performance materiality",pos:"noun phrase",cat:"risk",ja:"手続実施上の重要性",def:"An amount set below overall materiality to reduce the risk that undetected misstatements aggregate to a material amount.",ex:"Performance materiality was set at 75% of overall materiality.",note:"未発見・未修正の虚偽表示の合計額が全体の重要性を超えるリスクを一定の低い水準に抑えるために設定する金額。"},
{id:36,term:"tolerable misstatement",pos:"noun phrase",cat:"risk",ja:"許容可能な虚偽表示",def:"The maximum misstatement in a population the auditor is willing to accept.",ex:"Tolerable misstatement for the sample was set at half of performance materiality.",note:"サンプリングにおいて、母集団に存在しても許容できると監査人が判断する虚偽表示の最大額。"},
{id:37,term:"professional skepticism",pos:"noun phrase",cat:"risk",ja:"職業的懐疑心",def:"An attitude that includes a questioning mind and a critical assessment of audit evidence.",ex:"Professional skepticism requires the auditor not to accept management's explanations at face value.",note:"監査証拠に矛盾がないか、経営者の説明に疑わしい点がないかを批判的に評価する姿勢。"},
{id:38,term:"fraud",pos:"noun",cat:"risk",ja:"不正",def:"An intentional act by one or more individuals to obtain an unjust or illegal advantage.",ex:"The investigation revealed that fraud had occurred through fictitious sales entries.",note:"不当または違法な利益を得るために意図的に行われる行為。誤謬(error)とは区別される。"},
{id:39,term:"fraud triangle",pos:"noun phrase",cat:"risk",ja:"不正のトライアングル",def:"A model explaining the three conditions generally present when fraud occurs: incentive, opportunity, and rationalization.",ex:"The fraud triangle helps auditors understand why employees might commit fraud.",note:"動機・プレッシャー、機会、正当化の3要素が揃うことで不正が発生しやすくなるという考え方。"},
{id:40,term:"misstatement",pos:"noun",cat:"risk",ja:"虚偽表示",def:"A difference between the amount, classification, or presentation of a reported item and what is required for fair presentation.",ex:"The misstatement resulted from an incorrect application of the revenue recognition standard.",note:"報告された金額や表示が、適正な財務諸表として要求される内容と異なっていること。"},
{id:41,term:"reasonable assurance",pos:"noun phrase",cat:"risk",ja:"合理的保証",def:"A high, but not absolute, level of assurance.",ex:"An audit provides reasonable assurance, not absolute assurance, that the financial statements are free of material misstatement.",note:"監査は絶対的な保証ではなく、高い水準ではあるが完全ではない保証を提供するという考え方。"},
{id:42,term:"sampling risk",pos:"noun phrase",cat:"risk",ja:"サンプリングリスク",def:"The risk that the auditor's conclusion based on a sample differs from the conclusion if the entire population were tested.",ex:"Sampling risk can be reduced by increasing the sample size.",note:"サンプルに基づく結論が、母集団全体を検討した場合の結論と異なってしまうリスク。"},
{id:43,term:"management override of controls",pos:"noun phrase",cat:"risk",ja:"経営者による内部統制の無効化",def:"The risk that management can circumvent controls that otherwise appear to be operating effectively.",ex:"Management override of controls is a presumed fraud risk in every audit.",note:"経営者が自らの権限を利用して、有効に機能している内部統制を無効化してしまうリスク。すべての監査で不正リスクとして推定される。"},

{id:44,term:"existence",pos:"noun",cat:"assertion",ja:"実在性",def:"The assertion that assets, liabilities, and equity interests actually exist.",ex:"Physical inspection of equipment tested the existence assertion.",note:"資産や負債が実際に存在するという経営者の主張(アサーション)。"},
{id:45,term:"completeness",pos:"noun",cat:"assertion",ja:"網羅性",def:"The assertion that all transactions and balances that should have been recorded have been recorded.",ex:"Tracing shipping documents to sales invoices tested completeness.",note:"記録すべき取引や残高がすべて漏れなく記録されているという主張。"},
{id:46,term:"valuation and allocation",pos:"noun phrase",cat:"assertion",ja:"評価の妥当性",def:"The assertion that assets, liabilities, and equity are included at appropriate amounts.",ex:"Recalculating the allowance for doubtful accounts tested valuation and allocation.",note:"資産、負債、資本が適切な金額で計上されているという主張。"},
{id:47,term:"rights and obligations",pos:"noun phrase",cat:"assertion",ja:"権利と義務",def:"The assertion that the entity holds the rights to assets and owes the recorded obligations.",ex:"Reviewing the title deed confirmed the rights and obligations assertion for the property.",note:"記録されている資産に対する権利や負債に対する義務が実際に会社に帰属しているという主張。"},
{id:48,term:"accuracy",pos:"noun",cat:"assertion",ja:"正確性",def:"The assertion that amounts and other data have been recorded appropriately.",ex:"Recalculating the invoice totals tested the accuracy assertion.",note:"金額やその他のデータが適切な金額で正確に記録されているという主張。"},
{id:49,term:"occurrence",pos:"noun",cat:"assertion",ja:"発生",def:"The assertion that recorded transactions actually took place.",ex:"Vouching sales entries to shipping documents tested the occurrence assertion.",note:"記録されている取引が実際に発生したものであるという主張。"},
{id:50,term:"classification",pos:"noun",cat:"assertion",ja:"分類",def:"The assertion that transactions and events have been recorded in the proper accounts.",ex:"Reviewing the chart of accounts helped test classification.",note:"取引や事象が適切な勘定科目に分類・記録されているという主張。"},
{id:51,term:"cutoff (assertion)",pos:"noun",cat:"assertion",ja:"期間帰属(アサーション)",def:"The assertion that transactions have been recorded in the correct accounting period.",ex:"Cutoff testing near year-end addressed the cutoff assertion.",note:"取引が正しい会計期間に記録されているという主張。"},
{id:52,term:"presentation and disclosure",pos:"noun phrase",cat:"assertion",ja:"表示と開示",def:"The assertion that items are appropriately presented, described, and disclosed in the financial statements.",ex:"Reviewing the notes to the financial statements tested presentation and disclosure.",note:"財務諸表の項目が適切に表示・記述・開示されているという主張。"},

{id:53,term:"balance sheet",pos:"noun",cat:"fs",ja:"貸借対照表",def:"A statement showing an entity's assets, liabilities, and equity at a point in time.",ex:"The balance sheet showed total assets of 10 billion yen.",note:"ある時点における企業の資産・負債・純資産の状況を示す財務諸表。"},
{id:54,term:"income statement",pos:"noun",cat:"fs",ja:"損益計算書",def:"A statement showing an entity's revenues, expenses, and profit or loss over a period.",ex:"Revenue on the income statement grew by 8% year over year.",note:"一定期間における企業の収益・費用・利益の状況を示す財務諸表。"},
{id:55,term:"cash flow statement",pos:"noun phrase",cat:"fs",ja:"キャッシュ・フロー計算書",def:"A statement showing cash inflows and outflows classified by operating, investing, and financing activities.",ex:"Operating cash flow on the cash flow statement exceeded net income.",note:"一定期間の資金の増減を営業・投資・財務活動に区分して示す財務諸表。"},
{id:56,term:"statement of changes in equity",pos:"noun phrase",cat:"fs",ja:"株主資本等変動計算書",def:"A statement showing changes in each component of equity during the period.",ex:"Dividends paid were disclosed in the statement of changes in equity.",note:"一定期間における純資産の各項目の変動を示す財務諸表。"},
{id:57,term:"notes to financial statements",pos:"noun phrase",cat:"fs",ja:"財務諸表の注記",def:"Supplementary information that provides additional detail and context to the financial statements.",ex:"The notes to the financial statements disclosed the accounting policies used.",note:"財務諸表本体を補足する、会計方針や詳細情報などを記載した部分。"},
{id:58,term:"accrual basis",pos:"noun phrase",cat:"fs",ja:"発生主義",def:"An accounting method that records revenues and expenses when they are earned or incurred, not when cash changes hands.",ex:"Under the accrual basis, revenue is recognized when goods are delivered, not when cash is received.",note:"現金の収支ではなく、収益や費用が発生した時点で認識する会計上の考え方。"},
{id:59,term:"depreciation",pos:"noun",cat:"fs",ja:"減価償却(有形固定資産)",def:"The systematic allocation of the cost of a tangible fixed asset over its useful life.",ex:"Depreciation expense for the machinery was calculated using the straight-line method.",note:"有形固定資産の取得原価を、その耐用年数にわたって規則的に費用配分する会計処理。"},
{id:60,term:"amortization",pos:"noun",cat:"fs",ja:"償却(無形固定資産)",def:"The systematic allocation of the cost of an intangible asset over its useful life.",ex:"The amortization of the software license was recorded monthly.",note:"無形固定資産の取得原価を、その耐用年数にわたって規則的に費用配分する会計処理。"},
{id:61,term:"impairment",pos:"noun",cat:"fs",ja:"減損",def:"A permanent reduction in the recoverable value of an asset below its carrying amount.",ex:"The company recognized an impairment loss on the underperforming subsidiary.",note:"資産の回収可能価額が帳簿価額を下回り、その価値が実質的に減少していること。"},
{id:62,term:"goodwill",pos:"noun",cat:"fs",ja:"のれん",def:"The excess of the purchase price over the fair value of identifiable net assets acquired in a business combination.",ex:"Goodwill arising from the acquisition was tested annually for impairment.",note:"企業買収において、取得価額が識別可能な純資産の公正価値を上回る部分。"},
{id:63,term:"provision",pos:"noun",cat:"fs",ja:"引当金",def:"A liability of uncertain timing or amount recognized based on a present obligation.",ex:"A provision for warranty claims was recorded based on historical claim rates.",note:"支払いの時期や金額が不確実であるものの、現在の義務に基づいて認識される負債。"},
{id:64,term:"contingent liability",pos:"noun phrase",cat:"fs",ja:"偶発債務",def:"A potential obligation that depends on the outcome of a future uncertain event.",ex:"The pending lawsuit was disclosed as a contingent liability in the notes.",note:"将来の不確実な事象の結果によって発生するかどうかが決まる、現時点では確定していない債務。"},
{id:65,term:"deferred tax",pos:"noun phrase",cat:"fs",ja:"繰延税金",def:"Tax effects of temporary differences between the carrying amount of assets or liabilities and their tax basis.",ex:"A deferred tax asset was recognized for the unused tax loss carryforward.",note:"会計上と税務上の資産・負債の差異(一時差異)から生じる将来の税金への影響を財務諸表に反映させたもの。"},
{id:66,term:"consolidated financial statements",pos:"noun phrase",cat:"fs",ja:"連結財務諸表",def:"Financial statements presenting the financial position and results of a parent and its subsidiaries as a single economic entity.",ex:"The consolidated financial statements combined the results of all ten subsidiaries.",note:"親会社とその子会社を単一の組織体とみなして作成する財務諸表。"},
{id:67,term:"subsequent events",pos:"noun phrase",cat:"fs",ja:"後発事象",def:"Events occurring between the balance sheet date and the date the financial statements are issued.",ex:"A subsequent event was disclosed relating to a major customer's bankruptcy filing in January.",note:"決算日後から財務諸表が発行されるまでの間に発生した事象。財務諸表への影響を検討する必要がある。"},
{id:68,term:"related party transactions",pos:"noun phrase",cat:"fs",ja:"関連当事者取引",def:"Transactions between an entity and parties with significant influence over, or common control with, the entity.",ex:"Related party transactions with the CEO's family business were disclosed in the notes.",note:"会社と、その会社に対して重要な影響力を持つ者などとの間で行われる取引。"},
{id:69,term:"fair value",pos:"noun phrase",cat:"fs",ja:"公正価値",def:"The price that would be received to sell an asset in an orderly transaction between market participants.",ex:"The investment securities were remeasured at fair value at year-end.",note:"市場参加者間の秩序ある取引において資産を売却する際に受け取るであろう価格。"},
{id:70,term:"historical cost",pos:"noun phrase",cat:"fs",ja:"取得原価",def:"The original monetary value of an asset at the time it was acquired.",ex:"The building is recorded at historical cost less accumulated depreciation.",note:"資産を取得した時点での実際の支払対価。"},
{id:71,term:"accounts receivable",pos:"noun phrase",cat:"fs",ja:"売掛金",def:"Amounts owed to a company by customers for goods or services delivered on credit.",ex:"Accounts receivable increased due to slower customer payments.",note:"商品やサービスを掛けで販売したことにより生じる、顧客に対する債権。"},
{id:72,term:"accounts payable",pos:"noun phrase",cat:"fs",ja:"買掛金",def:"Amounts a company owes to its suppliers for goods or services purchased on credit.",ex:"Accounts payable was confirmed by comparing supplier statements to the recorded balance.",note:"商品やサービスを掛けで仕入れたことにより生じる、仕入先に対する債務。"},
{id:73,term:"allowance for doubtful accounts",pos:"noun phrase",cat:"fs",ja:"貸倒引当金",def:"A contra-asset account estimating the portion of receivables expected to be uncollectible.",ex:"The allowance for doubtful accounts was increased based on the aging analysis.",note:"売掛金のうち回収不能と見込まれる金額をあらかじめ見積もって計上する評価性引当金。"},

{id:74,term:"internal control",pos:"noun phrase",cat:"control",ja:"内部統制",def:"A process designed to provide reasonable assurance regarding the reliability of financial reporting, effectiveness of operations, and compliance with laws.",ex:"Internal control over the cash disbursement process included dual signature requirements.",note:"財務報告の信頼性、業務の有効性・効率性、法令遵守を確保するために企業内に整備される仕組み。"},
{id:75,term:"internal control over financial reporting (ICFR)",pos:"noun phrase",cat:"control",ja:"財務報告に係る内部統制",def:"Controls specifically designed to provide reasonable assurance regarding the reliability of financial reporting.",ex:"Management assessed the effectiveness of internal control over financial reporting as of year-end.",note:"財務諸表の信頼性を確保することを目的とした内部統制。日本のJ-SOXや米国のSOX法で評価が求められる。"},
{id:76,term:"control environment",pos:"noun phrase",cat:"control",ja:"統制環境",def:"The set of standards, processes, and structures that provide the foundation for carrying out internal control.",ex:"A strong control environment starts with tone at the top.",note:"内部統制の基盤となる、組織の気風や経営者の姿勢などを含む土台の部分。"},
{id:77,term:"segregation of duties",pos:"noun phrase",cat:"control",ja:"職務分掌",def:"Dividing responsibilities among different people to reduce the risk of error or fraud.",ex:"Segregation of duties ensured that the person recording cash receipts was not also reconciling the bank account.",note:"一人の担当者にすべての権限や職務を集中させず、複数人で分担することで不正や誤謬のリスクを減らす仕組み。"},
{id:78,term:"authorization",pos:"noun",cat:"control",ja:"承認",def:"Approval given by an appropriate level of management before a transaction is executed.",ex:"Purchases over 1 million yen required authorization from the finance director.",note:"取引が実行される前に、適切な権限を持つ者による承認を得ること。"},
{id:79,term:"reconciliation",pos:"noun",cat:"control",ja:"照合・調整",def:"The process of matching two sets of records to ensure they are in agreement and explaining any differences.",ex:"The bank reconciliation identified two outstanding checks.",note:"二つの記録を突き合わせ、一致しているかを確認し、差異があればその原因を説明するプロセス。"},
{id:80,term:"monitoring",pos:"noun",cat:"control",ja:"モニタリング",def:"Ongoing evaluations to ascertain whether internal controls are present and functioning.",ex:"Monitoring activities included periodic internal audits of the purchasing cycle.",note:"内部統制が適切に整備・運用されているかを継続的に評価する活動。COSOフレームワークの構成要素の一つ。"},
{id:81,term:"risk assessment",pos:"noun phrase",cat:"control",ja:"リスク評価",def:"The process of identifying and analyzing risks relevant to achieving the entity's objectives.",ex:"Management's risk assessment identified cybersecurity as an emerging risk.",note:"企業目標の達成を阻害する要因を識別し分析するプロセス。COSOの内部統制構成要素の一つ。"},
{id:82,term:"whistleblower",pos:"noun",cat:"control",ja:"内部告発者",def:"A person who reports suspected wrongdoing within an organization.",ex:"The whistleblower reported the accounting irregularities through the anonymous hotline.",note:"組織内の不正行為や違反を通報する者。内部通報制度は不正発見の重要な端緒となる。"},

{id:83,term:"independence",pos:"noun",cat:"ethics",ja:"独立性",def:"Freedom from relationships that would impair the auditor's objectivity.",ex:"The audit firm assessed its independence before accepting the engagement.",note:"監査人が被監査会社との間に、判断の客観性を損なうような利害関係を持たないこと。"},
{id:84,term:"due professional care",pos:"noun phrase",cat:"ethics",ja:"正当な注意",def:"The exercise of the skill and diligence expected of a competent auditor.",ex:"Due professional care requires the auditor to be diligent and thorough throughout the engagement.",note:"監査業務において、職業的専門家として通常期待される程度の注意深さと熱心さをもって業務を行うこと。"},
{id:85,term:"objectivity",pos:"noun",cat:"ethics",ja:"客観性",def:"A state of mind that reflects impartiality and freedom from conflicts of interest.",ex:"Objectivity requires the auditor not to allow bias to override professional judgment.",note:"偏見や利害の対立に影響されずに公正な判断を行う姿勢。"},
{id:86,term:"integrity",pos:"noun",cat:"ethics",ja:"誠実性",def:"Being straightforward and honest in all professional and business relationships.",ex:"Integrity is one of the fundamental principles in the code of ethics for professional accountants.",note:"すべての業務上の関係において、正直かつ率直であること。職業倫理の基本原則の一つ。"},
{id:87,term:"confidentiality",pos:"noun",cat:"ethics",ja:"守秘義務",def:"The obligation to protect client information from unauthorized disclosure or use.",ex:"Confidentiality prevents the auditor from disclosing client information without proper authority.",note:"業務上知り得た情報を、正当な権限なく第三者に開示したり自己の利益のために利用したりしない義務。"},
{id:88,term:"engagement letter",pos:"noun phrase",cat:"ethics",ja:"監査契約書",def:"A letter documenting the terms of the audit engagement agreed between the auditor and the client.",ex:"The engagement letter outlined the scope, responsibilities, and fees for the audit.",note:"監査業務の範囲や監査人・経営者双方の責任、報酬などの条件を記載し、監査契約時に取り交わす文書。"},
{id:89,term:"working papers",pos:"noun phrase",cat:"ethics",ja:"監査調書",def:"The record of audit procedures performed, evidence obtained, and conclusions reached.",ex:"The working papers documented the basis for the auditor's conclusions on inventory valuation.",note:"実施した監査手続、入手した監査証拠、および到達した結論の記録。監査意見の根拠を示す重要な文書。"},
{id:90,term:"engagement partner",pos:"noun phrase",cat:"ethics",ja:"業務執行社員",def:"The partner responsible for the audit engagement and its performance.",ex:"The engagement partner reviewed and signed the final audit report.",note:"監査業務の実施及び監査報告書に対して責任を負う社員(パートナー)。"},
{id:91,term:"quality control",pos:"noun phrase",cat:"ethics",ja:"品質管理",def:"Policies and procedures designed to provide reasonable assurance that engagements comply with professional standards.",ex:"The firm's quality control system included a mandatory engagement quality review.",note:"監査業務が職業的な基準や適用される法令等に準拠して実施されることについて合理的な保証を得るための方針と手続。"},
{id:92,term:"peer review",pos:"noun phrase",cat:"ethics",ja:"品質管理レビュー",def:"An independent review of a firm's audit practice to assess compliance with professional standards.",ex:"The firm underwent a peer review conducted by the professional accounting body.",note:"監査事務所の業務の質を、外部の第三者や事務所内の独立した部門が評価する制度。"},
{id:93,term:"group audit",pos:"noun phrase",cat:"ethics",ja:"グループ監査",def:"An audit of financial statements that include the financial information of more than one component.",ex:"The group audit involved coordination with auditors in five different countries.",note:"親会社と複数の子会社などから構成されるグループ全体の財務諸表に対する監査。"},
{id:94,term:"component auditor",pos:"noun phrase",cat:"ethics",ja:"構成単位の監査人",def:"An auditor who performs work on the financial information of a component for a group audit.",ex:"The group engagement team relied on the work of the component auditor in Vietnam.",note:"グループ監査において、特定の子会社等(構成単位)の監査を担当する監査人。"}
];

/* =========================================================
   State
========================================================= */
const state = {
  tab:"flash",
  mastered:new Set(),
  quizStats:{attempts:0,bestScore:0,totalQuestions:0,totalCorrect:0},
  filterCat:"all",
  onlyUnmastered:false,
  search:"",
  flashOrder:WORDS.map(w=>w.id),
  flashIndex:0,
  flipped:false,
  openRows:new Set(),
  quiz:null,
  resetConfirm:false
};

const byId = id => WORDS.find(w=>w.id===id);

/* =========================================================
   Storage
========================================================= */
async function loadProgress(){
  try{
    const r = await window.storage.get("mastered", false);
    if(r && r.value) state.mastered = new Set(JSON.parse(r.value));
  }catch(e){ /* no saved data yet */ }
  try{
    const r = await window.storage.get("quizstats", false);
    if(r && r.value) state.quizStats = JSON.parse(r.value);
  }catch(e){ /* no saved data yet */ }
  render();
}
async function saveMastered(){
  try{ await window.storage.set("mastered", JSON.stringify([...state.mastered]), false); }
  catch(e){ console.error("save mastered failed", e); }
}
async function saveQuizStats(){
  try{ await window.storage.set("quizstats", JSON.stringify(state.quizStats), false); }
  catch(e){ console.error("save quizstats failed", e); }
}

/* =========================================================
   Helpers
========================================================= */
function filteredWords(){
  return WORDS.filter(w=>{
    if(state.filterCat!=="all" && w.cat!==state.filterCat) return false;
    if(state.onlyUnmastered && state.mastered.has(w.id)) return false;
    if(state.search){
      const q=state.search.toLowerCase();
      if(!w.term.toLowerCase().includes(q) && !w.ja.includes(state.search)) return false;
    }
    return true;
  });
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* =========================================================
   Render root
========================================================= */
function render(){
  const total = WORDS.length;
  const masteredCount = state.mastered.size;
  const app = document.getElementById("app");
  app.innerHTML = `
    <header class="site">
      <div class="title-row">
        <span class="title-en">Audit Vocabulary Ledger</span>
        <span class="title-ja">監査英単語帳</span>
      </div>
      <div class="subline">監査法人・会計士実務で使われる英単語を、監査調書のように整理して覚えるための学習ノートです。</div>
      <div class="stat-line">
        <span>収録語数 <b>${total}</b></span>
        <span>習得済み <b>${masteredCount}</b></span>
        <span>習得率 <b>${total?Math.round(masteredCount/total*100):0}%</b></span>
      </div>
      <nav class="tabs">
        ${tabBtn("flash","A","フラッシュカード")}
        ${tabBtn("quiz","B","クイズ")}
        ${tabBtn("list","C","単語一覧")}
        ${tabBtn("progress","D","学習の記録")}
      </nav>
    </header>
    <main id="main"></main>
    <footer class="note">全${total}語 ・ 進捗はこのブラウザ内に自動保存されます。カードや一覧の「習得済み」チェックはいつでも変更できます。</footer>
  `;
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.addEventListener("click",()=>{ state.tab=b.dataset.tab; if(state.tab==="quiz"&&!state.quiz){} render(); });
  });
  const main = document.getElementById("main");
  if(state.tab==="flash") renderFlash(main);
  else if(state.tab==="quiz") renderQuiz(main);
  else if(state.tab==="list") renderList(main);
  else renderProgress(main);
}
function tabBtn(tab,idx,label){
  return `<button data-tab="${tab}" class="${state.tab===tab?'active':''}"><span class="idx">${idx}</span>${label}</button>`;
}
function chipRowHTML(){
  const cats = [["all","すべて"],...Object.entries(CATS)];
  return `<div class="chip-row">${cats.map(([k,label])=>
    `<button class="chip ${state.filterCat===k?'active':''}" data-cat="${k}">${label}</button>`
  ).join("")}</div>`;
}
function bindChipRow(container,onChange){
  container.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click",()=>{ state.filterCat=c.dataset.cat; onChange(); });
  });
}

/* =========================================================
   Flashcards
========================================================= */
function renderFlash(main){
  const pool = filteredWords();
  state.flashOrder = state.flashOrder.filter(id=>pool.some(w=>w.id===id));
  pool.forEach(w=>{ if(!state.flashOrder.includes(w.id)) state.flashOrder.push(w.id); });
  if(state.flashIndex>=state.flashOrder.length) state.flashIndex=0;

  main.innerHTML = `
    <div class="controls-row">
      ${chipRowHTML()}
      <label class="toggle-inline"><input type="checkbox" id="onlyUnmastered" ${state.onlyUnmastered?"checked":""}> 未習得のみ表示</label>
    </div>
    <div class="controls-row" style="margin-top:-8px;">
      <button class="btn ghost" id="shuffleBtn">シャッフル</button>
    </div>
    <div id="flashArea"></div>
  `;
  bindChipRow(main,()=>{state.flashIndex=0;render();});
  main.querySelector("#onlyUnmastered").addEventListener("change",e=>{state.onlyUnmastered=e.target.checked;state.flashIndex=0;render();});
  main.querySelector("#shuffleBtn").addEventListener("click",()=>{state.flashOrder=shuffle(state.flashOrder);state.flashIndex=0;state.flipped=false;render();});

  const area = main.querySelector("#flashArea");
  if(state.flashOrder.length===0){
    area.innerHTML = `<div class="empty-note">条件に一致する単語がありません。フィルタを変更してください。</div>`;
    return;
  }
  const w = byId(state.flashOrder[state.flashIndex]);
  const isMastered = state.mastered.has(w.id);
  area.innerHTML = `
    <div class="flash-wrap">
      <div class="progress-mini">${state.flashIndex+1} / ${state.flashOrder.length} ${isMastered?" ・ 習得済み":""}</div>
      <div class="card-scene">
        <div class="card ${state.flipped?'flipped':''}" id="flipCard">
          <div class="card-face front">
            <div class="card-top">
              <span class="ref-no">No. ${String(w.id).padStart(3,"0")}</span>
              <span class="cat-tag">${CATS[w.cat]}</span>
            </div>
            <div class="card-term">${esc(w.term)}</div>
            <div class="card-pos">(${esc(w.pos)})</div>
            <div class="card-hint">クリックまたはタップで日本語訳を表示</div>
          </div>
          <div class="card-face back">
            <div class="card-ja">${esc(w.ja)}</div>
            <div class="card-def">${esc(w.def)}</div>
            <div class="card-ex">${esc(w.ex)}</div>
            <div class="card-note-label">ひとことメモ</div>
            <div class="card-note">${esc(w.note)}</div>
          </div>
        </div>
      </div>
      <div class="flash-controls">
        <button class="btn ghost" id="prevBtn" ${state.flashIndex===0?"disabled":""}>◀ 前へ</button>
        <button class="btn review" id="reviewBtn">△ 要復習</button>
        <button class="btn mastered" id="masteredBtn">${isMastered?"✓ 習得済み":"✓ 習得済みにする"}</button>
        <button class="btn ghost" id="nextBtn" ${state.flashIndex===state.flashOrder.length-1?"disabled":""}>次へ ▶</button>
      </div>
    </div>
  `;
  const card = area.querySelector("#flipCard");
  card.addEventListener("click",()=>{state.flipped=!state.flipped;render();});
  area.querySelector("#prevBtn").addEventListener("click",(e)=>{e.stopPropagation();state.flashIndex=Math.max(0,state.flashIndex-1);state.flipped=false;render();});
  area.querySelector("#nextBtn").addEventListener("click",(e)=>{e.stopPropagation();state.flashIndex=Math.min(state.flashOrder.length-1,state.flashIndex+1);state.flipped=false;render();});
  area.querySelector("#masteredBtn").addEventListener("click",(e)=>{
    e.stopPropagation();
    if(isMastered) state.mastered.delete(w.id); else state.mastered.add(w.id);
    saveMastered(); render();
  });
  area.querySelector("#reviewBtn").addEventListener("click",(e)=>{
    e.stopPropagation();
    state.mastered.delete(w.id); saveMastered();
    state.flashIndex=Math.min(state.flashOrder.length-1,state.flashIndex+1);
    state.flipped=false; render();
  });
}
document.addEventListener("keydown",(e)=>{
  if(state.tab!=="flash") return;
  if(e.key==="ArrowRight"){ state.flashIndex=Math.min(state.flashOrder.length-1,state.flashIndex+1); state.flipped=false; render(); }
  else if(e.key==="ArrowLeft"){ state.flashIndex=Math.max(0,state.flashIndex-1); state.flipped=false; render(); }
  else if(e.key===" "){ e.preventDefault(); state.flipped=!state.flipped; render(); }
});

/* =========================================================
   Quiz
========================================================= */
function makeQuiz(catFilter,count){
  let pool = catFilter==="all"?[...WORDS]:WORDS.filter(w=>w.cat===catFilter);
  pool = shuffle(pool);
  if(count!=="all") pool = pool.slice(0, Math.min(Number(count), pool.length));
  const questions = pool.map(w=>{
    let distractPool = WORDS.filter(x=>x.id!==w.id && x.cat===w.cat);
    if(distractPool.length<3) distractPool = WORDS.filter(x=>x.id!==w.id);
    const distractors = shuffle(distractPool).slice(0,3).map(x=>x.ja);
    const options = shuffle([w.ja,...distractors]);
    return {wordId:w.id, options, answer:w.ja};
  });
  return {questions, idx:0, score:0, missed:[], answered:false, chosen:null};
}
function renderQuiz(main){
  if(!state.quiz){
    main.innerHTML = `
      <div class="quiz-setup">
        <p style="color:var(--text-soft);font-size:.88rem;line-height:1.6;">出題範囲と問題数を選んでクイズを開始します。英単語を見て、正しい日本語訳を選んでください。</p>
        <label>出題カテゴリ
          <select id="quizCat">
            <option value="all">すべて (${WORDS.length}語)</option>
            ${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v} (${WORDS.filter(w=>w.cat===k).length}語)</option>`).join("")}
          </select>
        </label>
        <label>問題数
          <select id="quizCount">
            <option value="10">10問</option>
            <option value="20">20問</option>
            <option value="5">5問</option>
            <option value="all">出題範囲すべて</option>
          </select>
        </label>
        <button class="btn primary" id="startQuiz">クイズを開始する</button>
      </div>
    `;
    main.querySelector("#startQuiz").addEventListener("click",()=>{
      const cat = main.querySelector("#quizCat").value;
      const count = main.querySelector("#quizCount").value;
      state.quiz = makeQuiz(cat,count);
      render();
    });
    return;
  }
  const q = state.quiz;
  if(q.idx>=q.questions.length){ renderQuizResult(main); return; }
  const cur = q.questions[q.idx];
  const w = byId(cur.wordId);
  main.innerHTML = `
    <div class="quiz-head">
      <span>問 ${q.idx+1} / ${q.questions.length}</span>
      <span>正解数 ${q.score}</span>
    </div>
    <div class="quiz-term">${esc(w.term)}</div>
    <div class="quiz-options" id="quizOptions">
      ${cur.options.map((opt,i)=>`<button class="opt-btn" data-i="${i}">${esc(opt)}</button>`).join("")}
    </div>
    <div id="quizFeedbackArea"></div>
    <div class="quiz-next" id="quizNextArea"></div>
  `;
  main.querySelectorAll(".opt-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(q.answered) return;
      q.answered=true;
      const chosen = btn.textContent;
      q.chosen = chosen;
      const correct = chosen===cur.answer;
      if(correct) q.score++; else q.missed.push(w.id);
      main.querySelectorAll(".opt-btn").forEach(b=>{
        b.disabled=true;
        if(b.textContent===cur.answer) b.classList.add("correct");
        else if(b===btn) b.classList.add("wrong");
      });
      main.querySelector("#quizFeedbackArea").innerHTML = `
        <div class="quiz-feedback ${correct?'ok':'no'}">
          <b>${correct?"正解です。":"不正解です。"}</b> ${esc(w.term)}（${esc(w.ja)}）<br>${esc(w.note)}
        </div>`;
      main.querySelector("#quizNextArea").innerHTML = `<button class="btn primary" id="nextQ">${q.idx+1<q.questions.length?"次の問題へ":"結果を見る"}</button>`;
      main.querySelector("#nextQ").addEventListener("click",()=>{
        q.idx++; q.answered=false; q.chosen=null; render();
      });
    });
  });
}
function renderQuizResult(main){
  const q = state.quiz;
  const total = q.questions.length;
  const pct = total?Math.round(q.score/total*100):0;
  state.quizStats.attempts++;
  state.quizStats.bestScore = Math.max(state.quizStats.bestScore, pct);
  state.quizStats.totalQuestions += total;
  state.quizStats.totalCorrect += q.score;
  saveQuizStats();

  const missedWords = [...new Set(q.missed)].map(byId);
  main.innerHTML = `
    <div class="quiz-result">
      <div style="color:var(--text-soft);font-size:.85rem;">お疲れさまでした</div>
      <div class="quiz-score">${q.score} / ${total}</div>
      <div style="color:var(--text-soft);">正答率 ${pct}%</div>
      ${missedWords.length?`
        <div class="miss-list">
          <div style="font-size:.85rem;color:var(--text-soft);margin-bottom:8px;">間違えた単語</div>
          ${missedWords.map(w=>`<div class="miss-item"><b>${esc(w.term)}</b> — ${esc(w.ja)}</div>`).join("")}
        </div>`:`<p style="color:var(--green);margin-top:20px;">すべて正解でした。</p>`}
      <div class="result-actions">
        ${missedWords.length?`<button class="btn review" id="retryMissed">苦手な単語だけで復習</button>`:""}
        <button class="btn primary" id="retrySame">もう一度挑戦</button>
        <button class="btn ghost" id="backSetup">出題設定に戻る</button>
      </div>
    </div>
  `;
  if(missedWords.length){
    main.querySelector("#retryMissed").addEventListener("click",()=>{
      const ids = missedWords.map(w=>w.id);
      const questions = ids.map(id=>{
        const w = byId(id);
        let distractPool = WORDS.filter(x=>x.id!==w.id && x.cat===w.cat);
        if(distractPool.length<3) distractPool = WORDS.filter(x=>x.id!==w.id);
        const distractors = shuffle(distractPool).slice(0,3).map(x=>x.ja);
        return {wordId:w.id, options:shuffle([w.ja,...distractors]), answer:w.ja};
      });
      state.quiz = {questions:shuffle(questions), idx:0, score:0, missed:[], answered:false, chosen:null};
      render();
    });
  }
  main.querySelector("#retrySame").addEventListener("click",()=>{
    const ids = q.questions.map(x=>x.wordId);
    const questions = shuffle(ids).map(id=>{
      const w = byId(id);
      let distractPool = WORDS.filter(x=>x.id!==w.id && x.cat===w.cat);
      if(distractPool.length<3) distractPool = WORDS.filter(x=>x.id!==w.id);
      const distractors = shuffle(distractPool).slice(0,3).map(x=>x.ja);
      return {wordId:w.id, options:shuffle([w.ja,...distractors]), answer:w.ja};
    });
    state.quiz = {questions, idx:0, score:0, missed:[], answered:false, chosen:null};
    render();
  });
  main.querySelector("#backSetup").addEventListener("click",()=>{ state.quiz=null; render(); });
}

/* =========================================================
   List
========================================================= */
function renderList(main){
  const pool = filteredWords();
  main.innerHTML = `
    <div class="controls-row">
      <input type="text" class="list-search" id="searchInput" placeholder="英単語または日本語で検索" value="${esc(state.search)}">
      ${chipRowHTML()}
      <label class="toggle-inline"><input type="checkbox" id="onlyUnmasteredList" ${state.onlyUnmastered?"checked":""}> 未習得のみ</label>
    </div>
    <div style="font-size:.8rem;color:var(--text-soft);margin-bottom:6px;">${pool.length}件表示</div>
    <div id="listArea"></div>
  `;
  main.querySelector("#searchInput").addEventListener("input",e=>{state.search=e.target.value;render();});
  bindChipRow(main,render);
  main.querySelector("#onlyUnmasteredList").addEventListener("change",e=>{state.onlyUnmastered=e.target.checked;render();});

  const listArea = main.querySelector("#listArea");
  if(pool.length===0){
    listArea.innerHTML = `<div class="empty-note">該当する単語がありません。</div>`;
    return;
  }
  listArea.innerHTML = pool.map(w=>{
    const isMastered = state.mastered.has(w.id);
    const open = state.openRows.has(w.id);
    return `
      <div class="word-row ${open?'open':''}" data-id="${w.id}">
        <div class="word-row-head">
          <span class="w-no">${String(w.id).padStart(3,"0")}</span>
          <span class="w-term">${esc(w.term)}</span>
          <span class="w-ja">${esc(w.ja)}</span>
          <span class="w-tick ${isMastered?'on':''}" data-tick="${w.id}">✓</span>
        </div>
        <div class="word-row-body">
          <div class="card-def" style="margin-bottom:8px;">${esc(w.def)}</div>
          <div class="card-ex">${esc(w.ex)}</div>
          <div class="card-note-label" style="margin-top:10px;">ひとことメモ</div>
          <div class="card-note">${esc(w.note)}</div>
        </div>
      </div>`;
  }).join("");
  listArea.querySelectorAll(".word-row-head").forEach(head=>{
    head.addEventListener("click",(e)=>{
      if(e.target.dataset.tick) return;
      const row = head.parentElement;
      const id = Number(row.dataset.id);
      if(state.openRows.has(id)) state.openRows.delete(id); else state.openRows.add(id);
      render();
    });
  });
  listArea.querySelectorAll("[data-tick]").forEach(tick=>{
    tick.addEventListener("click",(e)=>{
      e.stopPropagation();
      const id = Number(tick.dataset.tick);
      if(state.mastered.has(id)) state.mastered.delete(id); else state.mastered.add(id);
      saveMastered(); render();
    });
  });
}

/* =========================================================
   Progress
========================================================= */
function renderProgress(main){
  const total = WORDS.length;
  const masteredCount = state.mastered.size;
  const pct = total?Math.round(masteredCount/total*100):0;
  const qs = state.quizStats;
  const accuracy = qs.totalQuestions?Math.round(qs.totalCorrect/qs.totalQuestions*100):null;

  main.innerHTML = `
    <div class="prog-top">
      <div class="prog-big">${pct}<small>%</small></div>
      <div style="flex:1;min-width:200px;">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div style="font-size:.82rem;color:var(--text-soft);margin-top:6px;">${masteredCount} / ${total} 語を習得済み</div>
      </div>
    </div>

    <div style="font-size:.9rem;font-weight:600;margin-bottom:12px;">カテゴリ別の進捗</div>
    ${Object.entries(CATS).map(([k,label])=>{
      const words = WORDS.filter(w=>w.cat===k);
      const done = words.filter(w=>state.mastered.has(w.id)).length;
      const p = words.length?Math.round(done/words.length*100):0;
      return `<div class="cat-prog-row">
        <div class="cat-prog-label"><span>${label}</span><span>${done} / ${words.length}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div>
      </div>`;
    }).join("")}

    <div class="stat-cards">
      <div class="stat-card"><div class="num">${qs.attempts}</div><div class="lbl">クイズ受験回数</div></div>
      <div class="stat-card"><div class="num">${qs.attempts?qs.bestScore+'%':'—'}</div><div class="lbl">ベストスコア</div></div>
      <div class="stat-card"><div class="num">${accuracy!==null?accuracy+'%':'—'}</div><div class="lbl">累計正答率</div></div>
    </div>

    <div class="reset-zone">
      ${state.resetConfirm?
        `<span style="font-size:.85rem;color:var(--red);margin-right:10px;">本当にすべての進捗を削除しますか？</span>
         <button class="btn review" id="resetYes">削除する</button>
         <button class="btn ghost" id="resetNo">キャンセル</button>`
        :
        `<button class="btn ghost" id="resetStart">学習の進捗をすべてリセット</button>`
      }
    </div>
  `;
  if(state.resetConfirm){
    main.querySelector("#resetYes").addEventListener("click",async ()=>{
      state.mastered = new Set();
      state.quizStats = {attempts:0,bestScore:0,totalQuestions:0,totalCorrect:0};
      state.resetConfirm=false;
      await saveMastered(); await saveQuizStats();
      render();
    });
    main.querySelector("#resetNo").addEventListener("click",()=>{state.resetConfirm=false;render();});
  }else{
    main.querySelector("#resetStart").addEventListener("click",()=>{state.resetConfirm=true;render();});
  }
}

/* =========================================================
   Init
========================================================= */
loadProgress();
</script>
