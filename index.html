const KEY = "audit-vocab-ledger-v2";
const INTERVALS = [0,1,3,7,14,30];   // 習得度(box)ごとの次回復習までの日数
const MASTER_BOX = 4;                // box 4以上を「習得済み」とみなす
const WMAP = new Map(WORDS.map(w=>[w.id,w]));
const byId = id => WMAP.get(id);
// 定義文・例文の日本語訳(単語の英語表記をキーにする)
const TR = new Map([...TR_A,...TR_B,...TR_C,...TR_D].map(a=>[a[0],{def:a[1],ex:a[2]}]));
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
let canPersist = true;
let introDone = false;
let lastSpoken = null;

/* ---------- utilities ---------- */
function ymd(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function today(){ return ymd(new Date()); }
function addDays(s,n){
  const p = s.split("-").map(Number);
  return ymd(new Date(p[0],p[1]-1,p[2]+n));
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function num(x,d){ x=Number(x); return Number.isFinite(x)?x:(d||0); }
function speak(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/\(.*?\)/g,""));
    u.lang="en-US"; u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- data model ---------- */
function defaults(){
  return {v:2,words:{},days:{},
    quiz:{attempts:0,best:0,totalQ:0,totalC:0},
    settings:{goal:20,newPerDay:10,autoSpeak:false,showTr:true,focusCat:"mix"}};
}
// 英文(定義文・例文)の下に出す日本語訳。設定でオフにできる
function trHTML(w,key){
  const t=TR.get(w.term);
  if(!t || !state.data.settings.showTr) return "";
  return `<div class="tr tr-${key}">${esc(t[key])}</div>`;
}
function normalizeData(o){
  const d = defaults();
  if(!o || typeof o!=="object") return d;
  if(o.words && typeof o.words==="object"){
    Object.keys(o.words).forEach(k=>{
      const id = Number(k); if(!WMAP.has(id)) return;
      const r = o.words[k] || {};
      d.words[id] = {
        box:Math.min(5,Math.max(0,Math.floor(num(r.box)))),
        due:DATE_RE.test(r.due)?r.due:null,
        seen:Math.max(0,num(r.seen)), right:Math.max(0,num(r.right)), wrong:Math.max(0,num(r.wrong)),
        star:!!r.star,
        first:DATE_RE.test(r.first)?r.first:null,
        last:DATE_RE.test(r.last)?r.last:null
      };
    });
  }
  if(o.days && typeof o.days==="object"){
    Object.keys(o.days).forEach(k=>{
      if(!DATE_RE.test(k)) return;
      const r=o.days[k]||{};
      d.days[k]={n:Math.max(0,num(r.n)),q:Math.max(0,num(r.q)),c:Math.max(0,num(r.c))};
    });
  }
  if(o.quiz && typeof o.quiz==="object"){
    d.quiz={attempts:num(o.quiz.attempts),best:num(o.quiz.best),totalQ:num(o.quiz.totalQ),totalC:num(o.quiz.totalC)};
  }
  if(o.settings && typeof o.settings==="object"){
    const g=num(o.settings.goal,20), n=num(o.settings.newPerDay,10);
    d.settings={goal:Math.min(500,Math.max(1,Math.floor(g))),newPerDay:Math.min(100,Math.max(0,Math.floor(n))),autoSpeak:!!o.settings.autoSpeak,showTr:o.settings.showTr!==false,focusCat:(o.settings.focusCat==="all"||o.settings.focusCat==="mix"||(typeof o.settings.focusCat==="string"&&Object.prototype.hasOwnProperty.call(CATS,o.settings.focusCat)))?o.settings.focusCat:"mix"};
  }
  return d;
}

const state = {
  tab:"today",
  data:defaults(),
  filterCat:"all", filterStatus:"all", search:"",
  flashOrder:[], flashIndex:0, flipped:false,
  openRows:new Set(),
  quiz:null, quizMsg:"", quizPreset:null,
  session:null,
  notice:"", resetConfirm:false
};

/* ---------- storage ---------- */
function probeStorage(){
  try{ localStorage.setItem("__probe","1"); localStorage.removeItem("__probe"); return true; }catch(e){}
  return !!(window.storage && window.storage.set);
}
function save(){
  const s = JSON.stringify(state.data);
  try{ localStorage.setItem(KEY,s); }catch(e){}
  try{
    if(window.storage && window.storage.set){
      const p = window.storage.set(KEY,s,false);
      if(p && p.catch) p.catch(()=>{});
    }
  }catch(e){}
}
async function migrateLegacy(){
  if(!(window.storage && window.storage.get)) return;
  try{
    const r = await window.storage.get("mastered",false);
    if(r && r.value){
      const t=today();
      JSON.parse(r.value).forEach(id=>{
        if(WMAP.has(id)){ const x=rec(id); x.box=5; x.due=addDays(t,INTERVALS[5]); x.first=t; x.seen=1; }
      });
    }
  }catch(e){}
  try{
    const r = await window.storage.get("quizstats",false);
    if(r && r.value){
      const q=JSON.parse(r.value);
      state.data.quiz={attempts:num(q.attempts),best:num(q.bestScore),totalQ:num(q.totalQuestions),totalC:num(q.totalCorrect)};
    }
  }catch(e){}
  save();
}
async function loadProgress(){
  canPersist = probeStorage();
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(!raw && window.storage && window.storage.get){
    try{ const r = await window.storage.get(KEY,false); if(r && r.value) raw=r.value; }catch(e){}
  }
  if(raw){
    try{ state.data = normalizeData(JSON.parse(raw)); }catch(e){ state.data = defaults(); }
  }else{
    await migrateLegacy();
  }
  render();
}

/* ---------- per-word record & SRS ---------- */
function rec(id){
  let r = state.data.words[id];
  if(!r){ r = state.data.words[id] = {box:0,due:null,seen:0,right:0,wrong:0,star:false,first:null,last:null}; }
  return r;
}
function peek(id){ return state.data.words[id] || null; }
function isMastered(id){ const r=peek(id); return !!(r && r.due && r.box>=MASTER_BOX); }
function isDue(id){ const r=peek(id); return !!(r && r.due && r.due<=today()); }
function isFresh(id){ const r=peek(id); return !r || !r.due; }

function matchStatus(w,st){
  const r=peek(w.id);
  switch(st){
    case "unmastered": return !isMastered(w.id);
    case "mastered": return isMastered(w.id);
    case "weak": return !!(r && r.wrong>0 && !isMastered(w.id));
    case "star": return !!(r && r.star);
    case "due": return isDue(w.id);
    default: return true;
  }
}
function stats(){
  let mastered=0,learning=0,fresh=0,due=0,weak=0,star=0;
  for(const w of WORDS){
    const r=state.data.words[w.id];
    if(!r || !r.due) fresh++;
    else if(r.box>=MASTER_BOX) mastered++;
    else learning++;
    if(isDue(w.id)) due++;
    if(r && r.wrong>0 && !isMastered(w.id)) weak++;
    if(r && r.star) star++;
  }
  return {mastered,learning,fresh,due,weak,star};
}
function dayRec(t){
  t = t || today();
  return state.data.days[t] || (state.data.days[t]={n:0,q:0,c:0});
}
function bumpActivity(n){ dayRec().n += (n||1); }
function todayCount(){ const d=state.data.days[today()]; return d?d.n:0; }
function streak(){
  let t=today(), c=0;
  if(!(state.data.days[t] && state.data.days[t].n>0)) t=addDays(t,-1);
  while(state.data.days[t] && state.data.days[t].n>0){ c++; t=addDays(t,-1); }
  return c;
}
function newToday(){
  const t=today(); let n=0;
  for(const w of WORDS){ const r=state.data.words[w.id]; if(r && r.first===t) n++; }
  return n;
}
function rate(id,grade){
  const r=rec(id), t=today();
  r.seen++; r.last=t; if(!r.first) r.first=t;
  if(grade==="again"){ r.box=0; r.due=t; }
  else if(grade==="hard"){ r.box=Math.max(1,r.box-1); r.due=addDays(t,1); }
  else { r.box=Math.min(5,r.box+1); r.due=addDays(t,INTERVALS[r.box]); }
  bumpActivity(1); save();
}
function toggleMastered(id){
  const r=rec(id), t=today();
  if(isMastered(id)){ r.box=0; r.due = r.seen>0 ? t : null; }
  else { r.box=5; r.due=addDays(t,INTERVALS[5]); if(!r.first) r.first=t; }
  save();
}
function markReview(id){
  const r=rec(id), t=today();
  r.box=0; r.due=t; if(!r.first) r.first=t; save();
}
function toggleStar(id){
  const r=rec(id); r.star=!r.star; save();
  document.querySelectorAll('[data-star="'+id+'"]').forEach(b=>b.classList.toggle("on",r.star));
  refreshHeader();
}
function recordAnswer(id,correct){
  const r=rec(id), t=today();
  if(correct) r.right++;
  else { r.wrong++; r.box=0; r.due=t; if(!r.first) r.first=t; }
  const d=dayRec(t); d.q++; if(correct) d.c++;
  bumpActivity(1); save();
}
function nextLabel(box,grade){
  if(grade==="again") return "もう一度";
  if(grade==="hard") return "1日後";
  return INTERVALS[Math.min(5,box+1)]+"日後";
}

/* ---------- filters ---------- */
function filteredWords(useSearch){
  const raw = state.search.trim();
  const q = raw.toLowerCase();
  return WORDS.filter(w=>{
    if(state.filterCat!=="all" && w.cat!==state.filterCat) return false;
    if(!matchStatus(w,state.filterStatus)) return false;
    if(useSearch && q){
      if(!(w.term.toLowerCase().includes(q) || w.ja.includes(raw) || w.def.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

// 新しく覚える単語の候補。focusCat: all=収録順 / mix=全カテゴリを交互に / カテゴリ名=そのカテゴリだけ
function freshPool(){
  const f=state.data.settings.focusCat||"mix";
  const fresh=WORDS.filter(w=>isFresh(w.id));
  if(f==="all") return fresh;
  if(f==="mix"){
    const groups=Object.keys(CATS).map(k=>fresh.filter(w=>w.cat===k)).filter(g=>g.length);
    const out=[]; let i=0;
    while(out.length<fresh.length){ for(const g of groups){ if(i<g.length) out.push(g[i]); } i++; }
    return out;
  }
  return fresh.filter(w=>w.cat===f);
}
function buildSession(opts){
  opts = opts || {};
  const t=today();
  let due = WORDS.filter(w=>isDue(w.id));
  due.sort((a,b)=>{
    const ra=state.data.words[a.id], rb=state.data.words[b.id];
    return ra.due<rb.due?-1:ra.due>rb.due?1:ra.box-rb.box;
  });
  due = due.slice(0,60);
  const quota = opts.extraNew ? opts.extraNew : Math.max(0,state.data.settings.newPerDay-newToday());
  const fresh = freshPool().slice(0,quota);
  const queue = opts.onlyNew ? fresh.map(w=>w.id) : [...due.map(w=>w.id),...fresh.map(w=>w.id)];
  return {queue,idx:0,flipped:false,counts:{again:0,hard:0,good:0},completed:new Set(),total:queue.length,label:opts.label||"今日の学習"};
}
function startSession(opts){
  const s=buildSession(opts);
  if(!s.queue.length){ state.notice="いま学習できる単語がありません。"; render(); return; }
  state.session=s; render();
}

/* =========================================================
   Quiz
========================================================= */
function normAns(s){ return String(s).toLowerCase().replace(/['’`]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function compact(s){ return normAns(s).replace(/ /g,""); }
function coreTerm(t){ return t.replace(/\s*\(.*?\)\s*/g," ").trim(); }
function acceptable(w){
  const out=new Set([compact(w.term),compact(coreTerm(w.term))]);
  const m=w.term.match(/\(([^)]+)\)/);
  if(m && /^[A-Z&\-\s]+$/.test(m[1])) out.add(compact(m[1]));
  return out;
}
function hintOf(w){
  return coreTerm(w.term).split(/\s+/).map(p=>p.charAt(0)+"_".repeat(Math.max(0,p.length-1))).join("  ");
}
function escRe(t){ return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function clozeOf(w){
  const core=coreTerm(w.term); if(!core) return null;
  const re=new RegExp(escRe(core)+"\\w*","i");
  if(!re.test(w.ex)) return null;
  return w.ex.replace(re,"＿＿＿＿＿");
}
function distract(w,key){
  const same=WORDS.filter(x=>x.id!==w.id && x.cat===w.cat);
  const pool=shuffle(same.length>=3?same:WORDS.filter(x=>x.id!==w.id));
  const out=[], seen=new Set([w[key]]);
  for(const x of pool){ if(!seen.has(x[key])){ seen.add(x[key]); out.push(x[key]); } if(out.length===3) break; }
  if(out.length<3){
    for(const x of shuffle(WORDS)){ if(x.id!==w.id && !seen.has(x[key])){ seen.add(x[key]); out.push(x[key]); } if(out.length===3) break; }
  }
  return out;
}
function pickDir(dir){
  if(dir==="mixed"){ const r=Math.random(); return r<0.34?"en2ja":r<0.67?"ja2en":"cloze"; }
  return dir;
}
function buildQ(w,dir){
  const d=pickDir(dir);
  if(d==="type") return {wordId:w.id,dir:"type",answer:w.term,hint:false};
  if(d==="cloze"){
    const sentence=clozeOf(w);
    if(sentence) return {wordId:w.id,dir:"cloze",sentence,options:shuffle([w.term,...distract(w,"term")]),answer:w.term};
    if(dir==="cloze") return null;
  }
  if(d==="ja2en") return {wordId:w.id,dir:"ja2en",options:shuffle([w.term,...distract(w,"term")]),answer:w.term};
  return {wordId:w.id,dir:"en2ja",options:shuffle([w.ja,...distract(w,"ja")]),answer:w.ja};
}
function makeQuiz(cat,count,dir,scope){
  let pool=WORDS.filter(w=>(cat==="all"||w.cat===cat) && matchStatus(w,scope));
  if(dir==="cloze") pool=pool.filter(w=>clozeOf(w));
  pool=shuffle(pool);
  if(count!=="all") pool=pool.slice(0,Number(count));
  return {dir,questions:pool.map(w=>buildQ(w,dir)).filter(Boolean),idx:0,score:0,missed:[],answered:false,recorded:false};
}
function renderQuiz(main){
  if(!state.quiz){
    const preset=state.quizPreset||{}; state.quizPreset=null;
    const scopes=[["all","すべての単語"],["unmastered","習得済み以外"],["due","復習の期限が来ている単語"],["weak","苦手な単語"],["star","★付きの単語"]];
    main.innerHTML=`
      <div class="quiz-setup">
        <p class="lead">出題範囲・形式・問題数を選んでクイズを開始します。間違えた単語は自動で「苦手」に入り、その日の復習対象にもなります。</p>
        ${state.quizMsg?`<div class="notice">${esc(state.quizMsg)}</div>`:""}
        <label class="sel full"><span>出題カテゴリ</span>
          <select id="quizCat"><option value="all">すべて (${WORDS.length}語)</option>
          ${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${esc(v)} (${WORDS.filter(w=>w.cat===k).length}語)</option>`).join("")}</select></label>
        <label class="sel full"><span>出題対象</span>
          <select id="quizScope">${scopes.map(([k,v])=>`<option value="${k}" ${preset.scope===k?"selected":""}>${v} (${statusCount(k)}語)</option>`).join("")}</select></label>
        <label class="sel full"><span>出題形式</span>
          <select id="quizDir">
            <option value="en2ja">英語 → 日本語(意味を選ぶ)</option>
            <option value="ja2en">日本語 → 英語(英語を選ぶ)</option>
            <option value="cloze">穴埋め(例文の空欄に入る英語を選ぶ)</option>
            <option value="type">スペル入力(日本語を見て英語を書く)</option>
            <option value="mixed">ランダム(英→日・日→英・穴埋め)</option>
          </select></label>
        <label class="sel full"><span>問題数</span>
          <select id="quizCount"><option value="10">10問</option><option value="20">20問</option><option value="30">30問</option><option value="50">50問</option><option value="all">出題範囲すべて</option></select></label>
        <button class="btn primary big" id="startQuiz" type="button">クイズを開始する</button>
      </div>`;
    main.querySelector("#startQuiz").addEventListener("click",()=>{
      const quiz=makeQuiz(main.querySelector("#quizCat").value,main.querySelector("#quizCount").value,main.querySelector("#quizDir").value,main.querySelector("#quizScope").value);
      if(!quiz.questions.length){ state.quizMsg="条件に合う単語がありません。出題対象やカテゴリを変更してください。"; }
      else { state.quizMsg=""; state.quiz=quiz; }
      render();
    });
    return;
  }
  const q=state.quiz;
  if(q.idx>=q.questions.length){ renderQuizResult(main); return; }
  const cur=q.questions[q.idx], w=byId(cur.wordId);
  let promptHTML="", body="";
  if(cur.dir==="cloze"){
    promptHTML=`<div class="quiz-sentence">${esc(cur.sentence)}</div><div class="quiz-sub">空欄に入る英語はどれですか</div>`;
  }else if(cur.dir==="ja2en"||cur.dir==="type"){
    promptHTML=`<div class="quiz-term ja">${esc(w.ja)}</div><div class="quiz-sub">${cur.dir==="type"?"この意味を表す英語を入力してください":"この意味を表す英語はどれですか"}</div>`;
  }else{
    promptHTML=`<div class="quiz-term">${esc(w.term)}<button class="speak-btn" data-say="${esc(w.term)}" type="button">▶ 発音</button></div>`;
  }
  if(cur.dir==="type"){
    body=`<form id="typeForm" class="type-form" autocomplete="off">
        <input type="text" id="typeInput" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="英語で入力" aria-label="英語で入力">
        <button class="btn primary" type="submit" id="typeSubmit">答える</button></form>
      <div class="btn-row center"><button class="btn ghost small" type="button" id="hintBtn">ヒントを見る</button>
        <button class="btn ghost small" type="button" id="giveUpBtn">わからない</button></div>
      <div id="hintArea" class="hint-area"></div>`;
  }else{
    body=`<div class="quiz-options" id="quizOptions">${cur.options.map((o,i)=>`<button class="opt-btn" data-i="${i}" type="button"><span class="opt-key">${i+1}</span>${esc(o)}</button>`).join("")}</div>`;
  }
  main.innerHTML=`
    <div class="quiz-head"><span>問 ${q.idx+1} / ${q.questions.length}</span><span>正解数 ${q.score}</span></div>
    ${promptHTML}${body}
    <div id="quizFeedbackArea"></div>
    <div class="quiz-next" id="quizNextArea"></div>`;

  const finish=(correct,userAns)=>{
    q.answered=true;
    recordAnswer(w.id,correct); refreshHeader();
    if(correct) q.score++; else q.missed.push(w.id);
    const wrongNote=(!correct && userAns)?`<div>あなたの答え: ${esc(userAns)}</div>`:"";
    main.querySelector("#quizFeedbackArea").innerHTML=`
      <div class="quiz-feedback ${correct?"ok":"no"}">
        <b>${correct?"正解です。":"不正解です。"}</b> ${esc(w.term)}(${esc(w.ja)})${wrongNote}
        <div class="fb-def">${esc(w.def)}</div>${trHTML(w,"def")}<div>${esc(w.note)}</div>
        ${cur.dir==="cloze"?`<div class="fb-ex"><i>${esc(w.ex)}</i>${trHTML(w,"ex")}</div>`:""}
        <button class="speak-btn" data-say="${esc(w.term)}" type="button" style="margin:8px 0 0 0;">▶ 発音</button>
      </div>`;
    main.querySelector("#quizNextArea").innerHTML=`<button class="btn primary" id="nextQ" type="button">${q.idx+1<q.questions.length?"次の問題へ":"結果を見る"}</button>`;
    const nb=main.querySelector("#nextQ");
    nb.addEventListener("click",()=>{ q.idx++; q.answered=false; render(); });
    nb.focus();
  };

  if(cur.dir==="type"){
    const input=main.querySelector("#typeInput");
    input.focus();
    main.querySelector("#hintBtn").addEventListener("click",()=>{
      main.querySelector("#hintArea").textContent="ヒント: "+hintOf(w);
    });
    const lock=()=>{ input.disabled=true; main.querySelector("#typeSubmit").disabled=true; main.querySelector("#hintBtn").disabled=true; main.querySelector("#giveUpBtn").disabled=true; };
    main.querySelector("#typeForm").addEventListener("submit",e=>{
      e.preventDefault();
      if(q.answered) return;
      const v=input.value.trim(); if(!v) return;
      lock();
      finish(acceptable(w).has(compact(v)),v);
    });
    main.querySelector("#giveUpBtn").addEventListener("click",()=>{ if(q.answered) return; lock(); finish(false,""); });
  }else{
    main.querySelectorAll(".opt-btn").forEach(btn=>{
      btn.addEventListener("click",()=>{
        if(q.answered) return;
        const chosen=cur.options[Number(btn.dataset.i)];
        const correct=chosen===cur.answer;
        main.querySelectorAll(".opt-btn").forEach(b=>{
          b.disabled=true;
          if(cur.options[Number(b.dataset.i)]===cur.answer) b.classList.add("correct");
          else if(b===btn) b.classList.add("wrong");
        });
        finish(correct,"");
      });
    });
  }
}
function renderQuizResult(main){
  const q=state.quiz, total=q.questions.length, pct=total?Math.round(q.score/total*100):0;
  if(!q.recorded){
    q.recorded=true;
    const z=state.data.quiz;
    z.attempts++; z.best=Math.max(z.best,pct); z.totalQ+=total; z.totalC+=q.score;
    save();
  }
  const missed=[...new Set(q.missed)].map(byId);
  main.innerHTML=`
    <div class="quiz-result">
      <div class="quiz-sub">お疲れさまでした</div>
      <div class="quiz-score">${q.score} / ${total}</div>
      <div class="quiz-sub">正答率 ${pct}%</div>
      ${missed.length?`<div class="miss-list"><div class="quiz-sub" style="text-align:left">間違えた単語(自動で「苦手」に追加されました)</div>
        ${missed.map(w=>`<div class="miss-item"><b>${esc(w.term)}</b> — ${esc(w.ja)}</div>`).join("")}</div>`
        :`<p style="color:var(--green);margin-top:20px;">すべて正解でした。</p>`}
      <div class="result-actions">
        ${missed.length?`<button class="btn review" id="retryMissed" type="button">間違えた単語だけで復習</button>`:""}
        <button class="btn primary" id="retrySame" type="button">同じ問題でもう一度</button>
        <button class="btn ghost" id="backSetup" type="button">出題設定に戻る</button>
      </div>
    </div>`;
  const restart=ids=>{
    state.quiz={dir:q.dir,questions:shuffle(ids).map(id=>buildQ(byId(id),q.dir)).filter(Boolean),idx:0,score:0,missed:[],answered:false,recorded:false};
    render();
  };
  const rm=main.querySelector("#retryMissed");
  if(rm) rm.addEventListener("click",()=>restart(missed.map(w=>w.id)));
  main.querySelector("#retrySame").addEventListener("click",()=>restart(q.questions.map(x=>x.wordId)));
  main.querySelector("#backSetup").addEventListener("click",()=>{state.quiz=null;render();});
}

/* =========================================================
   List
========================================================= */
function rowHTML(w){
  const r=peek(w.id), open=state.openRows.has(w.id), m=isMastered(w.id);
  const statusLine = r && r.due
    ? `習得度 ${r.box}/5 ・ 次回の復習 ${r.due} ・ 正解 ${r.right}回 / 不正解 ${r.wrong}回`
    : `まだ学習していません${r&&(r.right||r.wrong)?` ・ 正解 ${r.right}回 / 不正解 ${r.wrong}回`:""}`;
  return `<div class="word-row ${open?"open":""}" data-id="${w.id}">
    <div class="word-row-head">
      <span class="w-no">${String(w.id).padStart(3,"0")}</span>
      <span class="w-term">${esc(w.term)}</span>
      <span class="w-ja">${esc(w.ja)}</span>
      <button class="star-btn ${r&&r.star?"on":""}" data-star="${w.id}" type="button" aria-label="★を付ける・外す">★</button>
      <button class="w-tick ${m?"on":""}" data-tick="${w.id}" type="button" aria-label="習得済みにする・取り消す">✓</button>
    </div>
    <div class="word-row-body">
      <button class="speak-btn" data-say="${esc(w.term)}" type="button" style="margin:0 0 8px 0;">▶ 発音</button>
      <span class="cat-tag">${esc(CATS[w.cat])}</span>
      <div class="card-def" style="margin:8px 0;">${esc(w.def)}</div>${trHTML(w,"def")}
      <div class="card-ex">${esc(w.ex)}${trHTML(w,"ex")}</div>
      <div class="card-note-label" style="margin-top:10px;">ひとことメモ</div>
      <div class="card-note">${esc(w.note)}</div>
      <div class="row-status">${statusLine}</div>
    </div></div>`;
}
function renderList(main){
  main.innerHTML=filterBarHTML(`<label class="sel grow"><span>検索(英語・日本語・定義)</span><input type="text" id="searchInput" placeholder="例: materiality / 重要性" value="${esc(state.search)}"></label>`)+
    `<div class="count-line" id="countLine"></div><div id="listArea"></div>`;
  const listArea=main.querySelector("#listArea");
  const draw=()=>{
    const pool=filteredWords(true);
    main.querySelector("#countLine").textContent=pool.length+"件表示";
    listArea.innerHTML=pool.length?pool.map(rowHTML).join(""):`<div class="empty-note">該当する単語がありません。</div>`;
  };
  draw();
  bindFilterBar(main,render);
  main.querySelector("#searchInput").addEventListener("input",e=>{ state.search=e.target.value; draw(); });
  listArea.addEventListener("click",e=>{
    const tick=e.target.closest("[data-tick]");
    if(tick){
      const id=Number(tick.dataset.tick);
      toggleMastered(id); tick.classList.toggle("on",isMastered(id)); refreshHeader();
      const row=tick.closest(".word-row");
      if(row){ const ns=row.querySelector(".row-status"); if(ns){ const r=peek(id); ns.textContent=r&&r.due?`習得度 ${r.box}/5 ・ 次回の復習 ${r.due} ・ 正解 ${r.right}回 / 不正解 ${r.wrong}回`:"まだ学習していません"; } }
      return;
    }
    if(e.target.closest("button")) return;
    const head=e.target.closest(".word-row-head");
    if(head){
      const row=head.parentElement, id=Number(row.dataset.id);
      if(state.openRows.has(id)) state.openRows.delete(id); else state.openRows.add(id);
      row.classList.toggle("open",state.openRows.has(id));
    }
  });
}

/* =========================================================
   Progress
========================================================= */
function heatHTML(){
  const goal=state.data.settings.goal, t=today(), cells=[];
  for(let i=27;i>=0;i--){
    const d=addDays(t,-i), n=(state.data.days[d]||{}).n||0;
    const lv=n===0?0:n<goal*0.5?1:n<goal?2:n<goal*2?3:4;
    cells.push(`<div class="heat l${lv}" title="${d}: ${n}回"></div>`);
  }
  return `<div class="heat-grid">${cells.join("")}</div>
    <div class="heat-legend"><span>左上が28日前、右下が今日</span><span class="heat l0"></span>0<span class="heat l2"></span>目標の半分以上<span class="heat l4"></span>目標の2倍以上</div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(state.data,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="audit-vocab-progress-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function renderProgress(main){
  const st=stats(), total=WORDS.length, pct=Math.round(st.mastered/total*100);
  const d=state.data, qs=d.quiz, acc=qs.totalQ?Math.round(qs.totalC/qs.totalQ*100):null;
  const studiedDays=Object.keys(d.days).filter(k=>d.days[k].n>0).length;
  const weak=WORDS.filter(w=>matchStatus(w,"weak")).sort((a,b)=>peek(b.id).wrong-peek(a.id).wrong).slice(0,10);
  const seg=(n,c)=>`<div class="seg ${c}" style="width:${n/total*100}%" title="${n}語"></div>`;
  const notice=state.notice; state.notice="";
  main.innerHTML=`
    ${notice?`<div class="notice">${esc(notice)}</div>`:""}
    <div class="prog-top">
      <div class="prog-big">${pct}<small>%</small></div>
      <div style="flex:1;min-width:200px;">
        <div class="stack">${seg(st.mastered,"s-done")}${seg(st.learning,"s-learn")}${seg(st.fresh,"s-new")}</div>
        <div class="stack-legend"><span><i class="dot s-done"></i>習得済み ${st.mastered}語</span><span><i class="dot s-learn"></i>学習中 ${st.learning}語</span><span><i class="dot s-new"></i>未学習 ${st.fresh}語</span></div>
      </div>
    </div>

    <div class="stat-cards">
      <div class="stat-card"><div class="num">${streak()}日</div><div class="lbl">連続学習</div></div>
      <div class="stat-card"><div class="num">${studiedDays}日</div><div class="lbl">学習した日の合計</div></div>
      <div class="stat-card"><div class="num">${todayCount()}回</div><div class="lbl">今日の学習量</div></div>
      <div class="stat-card"><div class="num">${st.due}語</div><div class="lbl">復習待ち</div></div>
    </div>

    <h3 class="sec">直近28日の学習量</h3>${heatHTML()}

    <h3 class="sec">カテゴリ別の進捗</h3>
    ${Object.entries(CATS).map(([k,label])=>{
      const ws=WORDS.filter(w=>w.cat===k), done=ws.filter(w=>isMastered(w.id)).length, p=Math.round(done/ws.length*100);
      return `<div class="cat-prog-row"><div class="cat-prog-label"><span>${esc(label)}</span><span>${done} / ${ws.length}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${p}%"></div></div></div>`;
    }).join("")}

    <h3 class="sec">クイズの成績</h3>
    <div class="stat-cards">
      <div class="stat-card"><div class="num">${qs.attempts}</div><div class="lbl">受験回数</div></div>
      <div class="stat-card"><div class="num">${qs.attempts?qs.best+"%":"—"}</div><div class="lbl">ベストスコア</div></div>
      <div class="stat-card"><div class="num">${acc!==null?acc+"%":"—"}</div><div class="lbl">累計正答率</div></div>
    </div>

    <h3 class="sec">苦手な単語 <small>(間違えた回数が多い順)</small></h3>
    ${weak.length?`<div class="weak-list">${weak.map(w=>`<div class="miss-item"><b>${esc(w.term)}</b> — ${esc(w.ja)} <span class="mono dim">不正解 ${peek(w.id).wrong}回</span></div>`).join("")}</div>
      <div class="result-actions" style="justify-content:flex-start"><button class="btn review" id="weakQuiz" type="button">苦手な単語でクイズ</button><button class="btn" id="weakCards" type="button">苦手な単語を復習する</button></div>`
      :`<p class="panel-sub">まだありません。クイズで間違えた単語が、ここに自動で集まります。</p>`}

    <h3 class="sec">設定</h3>
    <div class="settings">
      <label class="sel"><span>1日の目標(学習量)</span><select id="setGoal">${[10,20,30,50,100].map(v=>`<option value="${v}" ${d.settings.goal===v?"selected":""}>${v}回</option>`).join("")}</select></label>
      <label class="sel"><span>1日に新しく覚える単語数</span><select id="setNew">${[0,5,10,15,20,30].map(v=>`<option value="${v}" ${d.settings.newPerDay===v?"selected":""}>${v}語</option>`).join("")}</select></label>
      <label class="check"><input type="checkbox" id="setTr" ${d.settings.showTr?"checked":""}> 英文(定義文・例文)の下に日本語訳を表示する</label>
      <label class="check"><input type="checkbox" id="setSpeak" ${d.settings.autoSpeak?"checked":""}> カードを表示したとき自動で発音する</label>
    </div>

    <h3 class="sec">バックアップ</h3>
    <p class="panel-sub">進捗はこのブラウザに保存されます。端末の変更やブラウザのデータ削除に備えて、ファイルに書き出せます。</p>
    <div class="result-actions" style="justify-content:flex-start">
      <button class="btn" id="exportBtn" type="button">バックアップを書き出す</button>
      <button class="btn" id="importBtn" type="button">バックアップを読み込む</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>

    <div class="reset-zone">
      ${state.resetConfirm
        ?`<span style="font-size:.85rem;color:var(--red);margin-right:10px;">本当にすべての進捗を削除しますか？(元に戻せません)</span>
          <button class="btn review" id="resetYes" type="button">削除する</button> <button class="btn ghost" id="resetNo" type="button">キャンセル</button>`
        :`<button class="btn ghost" id="resetStart" type="button">学習の進捗をすべてリセット</button>`}
    </div>`;
  const q=s=>main.querySelector(s);
  const wq=q("#weakQuiz"); if(wq) wq.addEventListener("click",()=>{state.tab="quiz";state.quiz=null;state.quizPreset={scope:"weak"};render();});
  const wc=q("#weakCards"); if(wc) wc.addEventListener("click",()=>{state.tab="today";startWeak();});
  q("#setGoal").addEventListener("change",e=>{state.data.settings.goal=Number(e.target.value);save();render();});
  q("#setNew").addEventListener("change",e=>{state.data.settings.newPerDay=Number(e.target.value);save();render();});
  q("#setSpeak").addEventListener("change",e=>{state.data.settings.autoSpeak=e.target.checked;save();});
  q("#setTr").addEventListener("change",e=>{state.data.settings.showTr=e.target.checked;save();});
  q("#exportBtn").addEventListener("click",exportData);
  q("#importBtn").addEventListener("click",()=>q("#importFile").click());
  q("#importFile").addEventListener("change",e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const obj=JSON.parse(String(fr.result));
        if(!obj || typeof obj!=="object" || !obj.words) throw new Error("bad");
        state.data=normalizeData(obj); save(); state.notice="バックアップを読み込みました。"; render();
      }catch(err){ state.notice="読み込めませんでした。このサイトで書き出したJSONファイルを選んでください。"; render(); }
    };
    fr.readAsText(f);
  });
  if(state.resetConfirm){
    q("#resetYes").addEventListener("click",()=>{state.data=defaults();save();state.resetConfirm=false;state.session=null;state.quiz=null;state.notice="進捗をリセットしました。";render();});
    q("#resetNo").addEventListener("click",()=>{state.resetConfirm=false;render();});
  }else{
    q("#resetStart").addEventListener("click",()=>{state.resetConfirm=true;render();});
  }
}

/* =========================================================
   Global events
========================================================= */
document.addEventListener("click",e=>{
  const t=e.target;
  if(!t || !t.closest) return;
  const sp=t.closest(".speak-btn");
  if(sp){ e.stopPropagation(); e.preventDefault(); speak(sp.dataset.say); return; }
  const st=t.closest("[data-star]");
  if(st){ e.stopPropagation(); e.preventDefault(); toggleStar(Number(st.dataset.star)); }
},true);

document.addEventListener("keydown",e=>{
  const tg=e.target;
  if(tg && (tg.tagName==="INPUT"||tg.tagName==="SELECT"||tg.tagName==="TEXTAREA")) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(tg && tg.tagName==="BUTTON" && (e.key===" "||e.key==="Enter")) return;
  if(state.tab==="today" && state.session && state.session.idx<state.session.queue.length){
    if(e.key===" "){ e.preventDefault(); if(!state.session.flipped) toggleSessionFlip(); }
    else if(state.session.flipped){
      if(e.key==="1") sessionRate("again");
      else if(e.key==="2") sessionRate("hard");
      else if(e.key==="3") sessionRate("good");
    }
  }else if(state.tab==="flash"){
    if(e.key==="ArrowRight") flashMove(1);
    else if(e.key==="ArrowLeft") flashMove(-1);
    else if(e.key===" "){ e.preventDefault(); if(state.flashOrder.length) toggleFlashFlip(); }
  }else if(state.tab==="quiz" && state.quiz && state.quiz.idx<state.quiz.questions.length){
    const q=state.quiz;
    if(!q.answered && /^[1-4]$/.test(e.key)){
      const b=document.querySelector('.opt-btn[data-i="'+(Number(e.key)-1)+'"]'); if(b) b.click();
    }else if(q.answered && (e.key==="Enter"||e.key===" ")){
      const n=document.getElementById("nextQ"); if(n){ e.preventDefault(); n.click(); }
    }
  }
});

loadProgress();

</script>
