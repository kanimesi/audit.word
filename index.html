<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Vocabulary Ledger ｜ 監査英単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Noto+Serif+JP:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141F2C;
    --ink2:#1D2C3D;
    --line-dark:rgba(242,239,230,0.14);
    --paper:#FBF8F1;
    --paper2:#F1EAD6;
    --line:#DCD2B4;
    --text:#1B2836;
    --text-soft:#5B6672;
    --text-on-ink:#F2EFE6;
    --text-on-ink-soft:#A9B4BF;
    --green:#1F6F4E;
    --green-bg:#E2EEE5;
    --red:#A6392F;
    --red-bg:#F5E3E0;
    --amber:#A97A1F;
    --amber-bg:#F4E9D2;
    --serif:'Source Serif 4','Noto Serif JP',serif;
    --sans:'Inter','Noto Sans JP',sans-serif;
    --mono:'IBM Plex Mono',monospace;
    --radius:5px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  #app{max-width:920px;margin:0 auto;padding:0 0 64px;}
  #loading{color:var(--text-on-ink-soft);text-align:center;padding:80px 20px;font-family:var(--mono);}

  /* ---------- Header ---------- */
  header.site{
    background:linear-gradient(180deg,var(--ink) 0%,var(--ink2) 100%);
    padding:36px 24px 20px;
    
  }
  @keyframes fadeDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
  .title-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .title-en{font-family:var(--serif);font-weight:600;font-size:2.05rem;color:var(--text-on-ink);letter-spacing:.2px;}
  .title-ja{font-family:var(--serif);font-size:1.05rem;color:var(--text-on-ink-soft);}
  .subline{margin-top:6px;color:var(--text-on-ink-soft);font-size:.92rem;line-height:1.6;max-width:56ch;}
  .stat-line{margin-top:14px;font-family:var(--mono);font-size:.8rem;color:var(--text-on-ink-soft);display:flex;gap:18px;flex-wrap:wrap;}
  .stat-line b{color:var(--text-on-ink);font-weight:500;}

  nav.tabs{display:flex;gap:2px;margin-top:22px;flex-wrap:wrap;border-top:1px solid var(--line-dark);padding-top:14px;}
  nav.tabs button{
    background:transparent;border:1px solid transparent;color:var(--text-on-ink-soft);
    font-family:var(--sans);font-size:.88rem;padding:9px 14px;border-radius:4px 4px 0 0;
    cursor:pointer;display:flex;align-items:center;gap:8px;
  }
  nav.tabs button .idx{font-family:var(--mono);font-size:.75rem;color:var(--amber);border:1px solid currentColor;border-radius:3px;padding:0 5px;}
  nav.tabs button.active{background:var(--paper);color:var(--text);}
  nav.tabs button.active .idx{color:var(--green);}
  nav.tabs button:not(.active):hover{color:var(--text-on-ink);}

  /* ---------- Main panel ---------- */
  main{background:var(--paper);padding:28px 24px 40px;min-height:420px;}

  .controls-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{
    font-size:.8rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--text-soft);cursor:pointer;font-family:var(--sans);
  }
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--text-on-ink);}
  .toggle-inline{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text-soft);margin-left:auto;cursor:pointer;user-select:none;}
  .toggle-inline input{accent-color:var(--green);width:14px;height:14px;}
  input[type=text], select{
    font-family:var(--sans);font-size:.88rem;padding:8px 10px;border:1px solid var(--line);
    border-radius:4px;background:#fff;color:var(--text);
  }
  select{cursor:pointer;}

  /* ---------- Flashcard ---------- */
  .flash-wrap{display:flex;flex-direction:column;align-items:center;}
  .progress-mini{font-family:var(--mono);font-size:.78rem;color:var(--text-soft);margin-bottom:14px;}
  .card-scene{perspective:1400px;width:100%;max-width:560px;height:340px;}
  .card{
    position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .card-face{
    position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);
    border-radius:8px;background:#fff;padding:26px 28px;display:flex;flex-direction:column;
    box-shadow:2px 2px 0 var(--line);
  }
  .card-face.back{transform:rotateY(180deg);background:var(--paper2);overflow-y:auto;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .ref-no{font-family:var(--mono);font-size:.75rem;color:var(--text-soft);}
  .cat-tag{font-size:.72rem;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper);}
  .card-term{font-family:var(--serif);font-size:2rem;color:var(--text);text-align:center;margin:auto 0;line-height:1.25;}
  .card-pos{text-align:center;font-style:italic;color:var(--text-soft);font-size:.85rem;margin-top:2px;}
  .card-hint{text-align:center;color:var(--text-soft);font-size:.76rem;margin-top:auto;}
  .card-ja{font-family:var(--serif);font-size:1.7rem;color:var(--text);margin-bottom:10px;}
  .card-def{font-size:.92rem;color:var(--text);margin-bottom:12px;line-height:1.6;}
  .card-ex{border-left:3px solid var(--amber);padding:6px 12px;font-style:italic;font-size:.85rem;color:var(--ink2);background:#fff;margin-bottom:12px;}
  .card-note-label{font-size:.75rem;color:var(--text-soft);margin-bottom:3px;}
  .card-note{font-size:.86rem;line-height:1.65;color:var(--text);}

  .flash-controls{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;justify-content:center;}
  .btn{
    font-family:var(--sans);font-size:.85rem;padding:9px 16px;border-radius:4px;border:1px solid var(--line);
    background:#fff;color:var(--text);cursor:pointer;
  }
  .btn:hover{border-color:var(--ink2);}
  .btn.ghost{background:transparent;}
  .btn.mastered{border-color:var(--green);color:var(--green);}
  .btn.mastered:hover{background:var(--green-bg);}
  .btn.review{border-color:var(--red);color:var(--red);}
  .btn.review:hover{background:var(--red-bg);}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--text-on-ink);}
  .btn.primary:hover{background:var(--ink2);}
  .btn:disabled{opacity:.4;cursor:default;}
  .empty-note{color:var(--text-soft);text-align:center;padding:60px 10px;font-size:.9rem;}

  /* ---------- Quiz ---------- */
  .quiz-setup{max-width:480px;margin:20px auto;display:flex;flex-direction:column;gap:14px;}
  .quiz-setup label{font-size:.82rem;color:var(--text-soft);display:flex;flex-direction:column;gap:5px;}
  .quiz-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:.8rem;color:var(--text-soft);margin-bottom:16px;}
  .quiz-term{font-family:var(--serif);font-size:1.9rem;text-align:center;margin:22px 0 26px;}
  .quiz-options{display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto;}
  .opt-btn{
    text-align:left;padding:12px 16px;border:1px solid var(--line);border-radius:5px;background:#fff;
    font-family:var(--sans);font-size:.94rem;cursor:pointer;color:var(--text);
  }
  .opt-btn:hover:not(:disabled){border-color:var(--ink2);}
  .opt-btn.correct{border-color:var(--green);background:var(--green-bg);}
  .opt-btn.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt-btn:disabled{cursor:default;}
  .quiz-feedback{max-width:520px;margin:18px auto 0;padding:14px 16px;border-radius:5px;font-size:.86rem;line-height:1.6;}
  .quiz-feedback.ok{background:var(--green-bg);color:#184a35;}
  .quiz-feedback.no{background:var(--red-bg);color:#6d2a23;}
  .quiz-next{display:flex;justify-content:center;margin-top:18px;}
  .quiz-result{max-width:560px;margin:10px auto;text-align:center;}
  .quiz-score{font-family:var(--serif);font-size:2.6rem;margin:14px 0 4px;}
  .miss-list{text-align:left;margin-top:22px;border-top:1px solid var(--line);padding-top:14px;}
  .miss-item{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.87rem;}
  .miss-item b{font-family:var(--serif);}
  .result-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap;}

  /* ---------- List ---------- */
  .list-search{width:100%;max-width:320px;}
  .word-row{border-bottom:1px solid var(--line);}
  .word-row-head{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;}
  .w-no{font-family:var(--mono);font-size:.75rem;color:var(--text-soft);width:38px;flex-shrink:0;}
  .w-term{font-family:var(--serif);font-size:1.05rem;flex:1;min-width:140px;}
  .w-ja{color:var(--text-soft);font-size:.9rem;flex:1;min-width:120px;}
  .w-tick{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.78rem;color:transparent;}
  .w-tick.on{background:var(--green);border-color:var(--green);color:#fff;}
  .word-row-body{display:none;padding:0 4px 16px 50px;}
  .word-row.open .word-row-body{display:block;}
  .word-row.open .word-row-head{background:var(--paper2);}

  .speak-btn{font-family:var(--sans);font-size:.72rem;padding:3px 9px;margin-left:8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink2);cursor:pointer;vertical-align:middle;}
  .speak-btn:hover{border-color:var(--ink2);}
  /* ---------- Progress ---------- */
  .prog-top{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:28px;}
  .prog-big{font-family:var(--serif);font-size:3rem;}
  .prog-big small{font-size:1rem;color:var(--text-soft);font-family:var(--sans);}
  .bar-track{background:var(--paper2);border-radius:4px;height:10px;overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;background:var(--green);transition:width .8s ease;}
  .cat-prog-row{margin-bottom:14px;}
  .cat-prog-label{display:flex;justify-content:space-between;font-size:.84rem;margin-bottom:5px;color:var(--text);}
  .cat-prog-label span:last-child{font-family:var(--mono);color:var(--text-soft);}
  .stat-cards{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px;}
  .stat-card{flex:1;min-width:140px;border:1px solid var(--line);border-radius:6px;padding:14px 16px;background:#fff;}
  .stat-card .num{font-family:var(--serif);font-size:1.7rem;}
  .stat-card .lbl{font-size:.78rem;color:var(--text-soft);margin-top:2px;}
  .reset-zone{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);}

  footer.note{max-width:920px;margin:0 auto;padding:18px 24px 40px;color:var(--text-on-ink-soft);font-size:.76rem;line-height:1.7;}

  @media(max-width:600px){
    header.site{padding:26px 16px 16px;}
    main{padding:22px 16px 32px;}
    .title-en{font-size:1.6rem;}
    .card-scene{height:380px;}
    .card-term{font-size:1.5rem;}
    .w-ja{display:none;}
  }

  /* ================= v3 additions ================= */
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .mono{font-family:var(--mono);}
  .dim{color:var(--text-soft);font-size:.76rem;margin-left:6px;}
  header.site.intro{animation:fadeDown .5s ease both;}

  nav.tabs button .badge{background:var(--amber);color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 7px;font-family:var(--mono);}
  nav.tabs button .badge[hidden]{display:none;}
  nav.tabs button.active .badge{background:var(--ink);color:var(--text-on-ink);}

  /* selects / filters */
  .controls-row{align-items:flex-end;}
  .sel{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--text-soft);}
  .sel select,.sel input[type=text]{font-size:.9rem;min-width:150px;}
  .sel.full select{width:100%;}
  .sel.grow{flex:1;min-width:200px;}
  .sel.grow input{width:100%;}
  .count-line{font-size:.8rem;color:var(--text-soft);margin:2px 0 6px;}
  .lead{color:var(--text-soft);font-size:.9rem;line-height:1.7;margin:0;}

  /* buttons */
  .btn.big{padding:13px 22px;font-size:.98rem;}
  .btn.small{padding:6px 12px;font-size:.78rem;}
  .btn.primary:disabled{background:var(--text-soft);border-color:var(--text-soft);}
  .btn-col{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .btn-row{display:flex;flex-wrap:wrap;gap:8px;}
  .btn-row.center{justify-content:center;margin-top:10px;}
  .rate-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .rate-row .btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:108px;padding:10px 18px;font-size:.95rem;font-weight:600;}
  .rate-row .btn small{font-weight:400;font-size:.72rem;color:var(--text-soft);}
  .btn.again{border-color:var(--red);color:var(--red);}
  .btn.again:hover{background:var(--red-bg);}
  .btn.hard{border-color:var(--amber);color:var(--amber);}
  .btn.hard:hover{background:var(--amber-bg);}
  .btn.good{border-color:var(--green);color:var(--green);}
  .btn.good:hover{background:var(--green-bg);}

  /* stars & card */
  .star-btn{border:none;background:transparent;font-size:1.3rem;line-height:1;color:var(--line);cursor:pointer;padding:2px 5px;border-radius:4px;}
  .star-btn:hover{color:var(--amber);}
  .star-btn.on{color:var(--amber);}
  .card-top-right{display:flex;align-items:center;gap:6px;}
  .card-scene{height:380px;}
  .card-face.back .card-ja{margin-top:8px;}
  .kbd-hint{margin-top:14px;font-size:.74rem;color:var(--text-soft);text-align:center;max-width:560px;line-height:1.6;}
  .speak-btn{font-family:var(--sans);font-size:.72rem;padding:3px 9px;margin-left:8px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink2);cursor:pointer;vertical-align:middle;}
  .speak-btn:hover{border-color:var(--ink2);}

  /* notice */
  .notice{background:var(--amber-bg);border:1px solid var(--amber);color:#5a410d;border-radius:5px;padding:10px 14px;font-size:.86rem;margin-bottom:16px;}

  /* today */
  .today-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .panel{border:1px solid var(--line);border-radius:8px;background:#fff;padding:18px 20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:.95rem;margin-bottom:10px;}
  .panel-sub{font-size:.84rem;color:var(--text-soft);line-height:1.7;margin:10px 0 0;}
  .streak{display:flex;align-items:baseline;gap:8px;margin-top:16px;font-size:.9rem;color:var(--text-soft);}
  .streak-num{font-family:var(--serif);font-size:2.6rem;color:var(--text);line-height:1;}
  .todo{list-style:none;margin:0;padding:0;}
  .todo li{display:flex;align-items:baseline;gap:6px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.88rem;}
  .todo li b{font-family:var(--serif);font-size:1.5rem;min-width:36px;text-align:right;}
  .todo li span{color:var(--text-soft);font-size:.8rem;margin-left:6px;}
  .howto{margin-top:20px;border:1px solid var(--line);border-radius:8px;background:var(--paper2);padding:12px 18px;font-size:.86rem;line-height:1.8;}
  .howto summary{cursor:pointer;font-weight:600;}
  .howto ul{margin:6px 0;padding-left:1.2em;}
  .sess-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.82rem;color:var(--text-soft);}
  .bar-track.slim{height:6px;margin-bottom:6px;}
  .done{max-width:560px;margin:10px auto;text-align:center;}
  .done-title{font-family:var(--serif);font-size:1.5rem;margin-bottom:16px;}
  .done .stat-cards{justify-content:center;}

  /* quiz */
  .quiz-setup{max-width:520px;}
  .quiz-sub{text-align:center;color:var(--text-soft);font-size:.82rem;}
  .quiz-term.ja{font-size:1.55rem;margin-bottom:6px;}
  .quiz-sentence{font-family:var(--serif);font-size:1.2rem;line-height:1.8;max-width:540px;margin:22px auto 8px;}
  .opt-btn{display:flex;gap:12px;align-items:baseline;}
  .opt-key{font-family:var(--mono);font-size:.72rem;color:var(--text-soft);border:1px solid var(--line);border-radius:3px;padding:0 5px;flex-shrink:0;}
  .type-form{display:flex;gap:8px;max-width:520px;margin:22px auto 0;}
  .type-form input{flex:1;font-size:1.05rem;padding:11px 12px;}
  .hint-area{text-align:center;font-family:var(--mono);color:var(--ink2);margin-top:10px;min-height:1.4em;letter-spacing:.5px;}
  .fb-def{opacity:.85;margin:6px 0 4px;}
  .quiz-feedback div{margin-top:4px;}
  .quiz-result .quiz-score{font-family:var(--serif);font-size:2.6rem;margin:12px 0 4px;}

  /* list */
  .w-tick{background:#fff;cursor:pointer;padding:0;}
  .row-status{margin-top:10px;font-size:.76rem;color:var(--text-soft);font-family:var(--mono);}
  .word-row-body{padding-left:50px;}
  .word-row-head .star-btn{margin-left:auto;}

  /* progress */
  .sec{font-family:var(--serif);font-size:1.05rem;margin:30px 0 12px;font-weight:600;}
  .sec small{font-family:var(--sans);font-weight:400;color:var(--text-soft);font-size:.76rem;}
  .stack{display:flex;height:14px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--paper2);}
  .seg.s-done,.dot.s-done{background:var(--green);}
  .seg.s-learn,.dot.s-learn{background:var(--amber);}
  .seg.s-new,.dot.s-new{background:var(--paper2);}
  .stack-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--text-soft);margin-top:8px;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:1px solid var(--line);}
  .heat-grid{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;max-width:520px;}
  .heat{aspect-ratio:1;border-radius:3px;background:var(--paper2);border:1px solid var(--line);}
  .heat.l1{background:#cfe3d6;border-color:#cfe3d6;}
  .heat.l2{background:#8fc0a4;border-color:#8fc0a4;}
  .heat.l3{background:var(--green);border-color:var(--green);}
  .heat.l4{background:#134c35;border-color:#134c35;}
  .heat-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.74rem;color:var(--text-soft);margin-top:8px;}
  .heat-legend .heat{width:12px;height:12px;aspect-ratio:auto;display:inline-block;}
  .heat-legend span:first-child{margin-right:10px;}
  .settings{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;}
  .check{display:flex;align-items:center;gap:8px;font-size:.86rem;cursor:pointer;}
  .check input{accent-color:var(--green);width:16px;height:16px;}
  .weak-list{border-top:1px solid var(--line);}

  @media(max-width:700px){
    .today-grid{grid-template-columns:1fr;}
  }
  @media(max-width:600px){
    .card-scene{height:430px;}
    .controls-row .sel{flex:1;min-width:140px;}
    .sel select{min-width:0;width:100%;}
    .heat-grid{grid-template-columns:repeat(7,1fr);}
    .type-form{flex-direction:column;}
    .rate-row .btn{min-width:92px;padding:10px 12px;}
    .word-row-body{padding-left:8px;}
  }
  @media(prefers-reduced-motion:reduce){
    .card{transition:none;}
    header.site.intro{animation:none;}
    .bar-fill{transition:none;}
  }

  /* ---- 英文の日本語訳 ---- */
  .tr{font-size:.84rem;line-height:1.7;color:var(--text-soft);}
  .tr-def{margin:-6px 0 12px;}
  .card-ex .tr{font-style:normal;margin-top:3px;padding-top:3px;border-top:1px dotted var(--line);}
  .word-row-body .tr-def{margin:-4px 0 8px;}
  .quiz-feedback .tr{margin:0 0 6px;opacity:.9;}
  .fb-ex .tr{font-style:normal;}
  .card-scene{height:470px;}
  @media(max-width:600px){ .card-scene{height:540px;} }

  .focus-sel{margin-top:14px;}
</style>
</head>
<body>
<div id="app"><div id="loading">読み込み中 …</div></div>
<script>
/* =========================================================
   単語データ
========================================================= */

const WORDS = [
{id:1,term:"audit opinion",pos:"noun",cat:"opinion",ja:"監査意見",def:"The auditor's formal conclusion on whether the financial statements are fairly presented.",ex:"The audit opinion is included in the final section of the report.",note:"監査人が財務諸表に対して表明する結論。監査報告書の中心となる記述。"},
{id:2,term:"unqualified opinion",pos:"noun",cat:"opinion",ja:"無限定適正意見",def:"An opinion stating the financial statements are presented fairly in all material respects, with no exceptions.",ex:"The company received an unqualified opinion for the third consecutive year.",note:"重要な点においてすべて適正に表示されていると判断した場合に出す、最も望ましい意見。"},
{id:3,term:"qualified opinion",pos:"noun",cat:"opinion",ja:"限定付適正意見",def:"An opinion stating the financial statements are fairly presented except for a specific matter.",ex:"Due to an unresolved inventory issue, the auditor issued a qualified opinion.",note:"一部の項目を除き適正であるとする意見。重要だが広範ではない虚偽表示や監査範囲の制約がある場合に出される。"},
{id:4,term:"adverse opinion",pos:"noun",cat:"opinion",ja:"不適正意見",def:"An opinion stating the financial statements do not present fairly, taken as a whole.",ex:"The adverse opinion reflected widespread and material misstatements.",note:"財務諸表全体が適正に表示されていないと判断した場合に出す、最も厳しい意見。"},
{id:5,term:"disclaimer of opinion",pos:"noun",cat:"opinion",ja:"意見不表明",def:"A statement that the auditor is unable to express an opinion due to insufficient evidence.",ex:"The auditor issued a disclaimer of opinion because management restricted access to key records.",note:"十分かつ適切な監査証拠を入手できず、意見を表明できない場合に出す結論。"},
{id:6,term:"going concern",pos:"noun phrase",cat:"opinion",ja:"継続企業の前提",def:"The assumption that an entity will continue operating for the foreseeable future.",ex:"The auditor identified substantial doubt about the company's going concern.",note:"企業が将来にわたって事業を継続できるという前提。重要な疑義がある場合は監査報告書に記載が必要。"},
{id:7,term:"emphasis of matter paragraph",pos:"noun phrase",cat:"opinion",ja:"強調事項区分",def:"A paragraph added to the audit report to draw attention to a matter appropriately presented in the financial statements.",ex:"An emphasis of matter paragraph was added regarding the pending litigation.",note:"意見に影響を与えないが、財務諸表利用者の理解のために特に強調すべき事項を記載する区分。"},
{id:8,term:"other matter paragraph",pos:"noun phrase",cat:"opinion",ja:"その他の事項区分",def:"A paragraph referring to a matter not presented in the financial statements but relevant to understanding the audit.",ex:"The other matter paragraph explained the scope limitation from the prior year.",note:"財務諸表には記載されていないが、監査や監査人の責任等の理解に関連する事項を説明する区分。"},
{id:9,term:"key audit matters (KAM)",pos:"noun phrase",cat:"opinion",ja:"監査上の主要な検討事項",def:"Matters that, in the auditor's professional judgment, were of most significance in the audit.",ex:"Revenue recognition was identified as a key audit matter.",note:"職業的専門家として当年度の監査において特に重要であると判断した事項。監査報告書に個別に記載される。"},
{id:10,term:"audit report",pos:"noun",cat:"opinion",ja:"監査報告書",def:"The formal written document containing the auditor's opinion on the financial statements.",ex:"The audit report was signed and dated as of the completion of fieldwork.",note:"監査の結果として監査人が作成する正式な報告書。意見の種類や根拠などが記載される。"},
{id:11,term:"management representation letter",pos:"noun phrase",cat:"opinion",ja:"経営者確認書",def:"A letter from management confirming representations made during the audit.",ex:"The management representation letter was obtained before the report was issued.",note:"監査終了時に経営者が監査人に対し、財務諸表の作成責任や開示の完全性などを文書で確認するもの。"},
{id:12,term:"predecessor auditor",pos:"noun",cat:"opinion",ja:"前任監査人",def:"The auditor who audited the entity's financial statements in a prior period and has been replaced.",ex:"The successor auditor contacted the predecessor auditor before accepting the engagement.",note:"前年度まで監査を担当していた監査人。監査人交代時には引継のための連絡を行うことが求められる。"},

{id:13,term:"substantive procedures",pos:"noun phrase",cat:"process",ja:"実証手続",def:"Audit procedures designed to detect material misstatements at the assertion level.",ex:"Substantive procedures included recalculating depreciation expense.",note:"財務諸表の金額や開示に重要な虚偽表示がないかを直接確かめるための手続。"},
{id:14,term:"test of controls",pos:"noun phrase",cat:"process",ja:"統制のテスト",def:"Procedures performed to evaluate the operating effectiveness of internal controls.",ex:"The auditor performed a test of controls over the purchasing process.",note:"内部統制が実際に有効に運用されているかを確かめる手続。"},
{id:15,term:"analytical procedures",pos:"noun phrase",cat:"process",ja:"分析的手続",def:"Evaluations of financial information through analysis of plausible relationships among data.",ex:"Analytical procedures revealed an unusual fluctuation in gross margin.",note:"財務データ間の関係や趨勢を分析し、異常な変動や矛盾がないかを検討する手続。"},
{id:16,term:"inquiry",pos:"noun",cat:"process",ja:"質問",def:"Seeking information from knowledgeable persons within or outside the entity.",ex:"Inquiry of the credit manager helped assess the allowance for doubtful accounts.",note:"経営者や従業員などに口頭または書面で質問し、情報を入手する監査手続。"},
{id:17,term:"inspection",pos:"noun",cat:"process",ja:"閲覧・査閲",def:"Examining records, documents, or physical assets.",ex:"Inspection of the purchase invoices confirmed the recorded amounts.",note:"記録、文書または有形資産を実際に確認する手続。"},
{id:18,term:"observation",pos:"noun",cat:"process",ja:"立会",def:"Watching a process or procedure being performed by others.",ex:"The auditor's observation of the physical inventory count took place on December 31.",note:"他者が実施しているプロセスや手続を監査人自らその場で見て確かめる手続。棚卸立会などが代表例。"},
{id:19,term:"external confirmation",pos:"noun phrase",cat:"process",ja:"外部確認",def:"Audit evidence obtained directly from a third party in response to a request.",ex:"External confirmation of the bank balance was received directly from the bank.",note:"監査人が第三者に対して直接照会し、書面などで回答を得る手続。銀行確認状が代表例。"},
{id:20,term:"recalculation",pos:"noun",cat:"process",ja:"再計算",def:"Checking the mathematical accuracy of documents or records.",ex:"Recalculation of the depreciation schedule confirmed no errors.",note:"会社が作成した計算の正確性を監査人自らが計算し直して確かめる手続。"},
{id:21,term:"reperformance",pos:"noun",cat:"process",ja:"再実施",def:"The auditor's independent execution of procedures or controls originally performed by the entity.",ex:"Reperformance of the bank reconciliation matched the client's results.",note:"会社が実施した手続や統制を、監査人が自ら独立して再度実施して確かめる手続。"},
{id:22,term:"vouching",pos:"noun",cat:"process",ja:"突合",def:"Tracing recorded transactions back to supporting documents to verify existence and accuracy.",ex:"Vouching the sales entries to shipping documents supported the occurrence assertion.",note:"記録された取引について、その根拠となる原始証憑まで遡って確認する手続。"},
{id:23,term:"tracing",pos:"noun",cat:"process",ja:"トレーシング",def:"Following a transaction forward from its source document into the accounting records.",ex:"Tracing the shipping documents to the sales ledger tested completeness.",note:"原始証憑から会計記録へ順方向に追跡し、記録の網羅性を確かめる手続。"},
{id:24,term:"walkthrough",pos:"noun",cat:"process",ja:"ウォークスルー",def:"Following a transaction through the accounting system from origination to reporting.",ex:"A walkthrough of the purchasing cycle helped the auditor understand the relevant controls.",note:"一つの取引を発生から財務諸表への反映まで実際にたどり、業務プロセスと統制を理解する手続。"},
{id:25,term:"sampling",pos:"noun",cat:"process",ja:"サンプリング",def:"Selecting less than 100% of a population for testing to draw a conclusion about the whole.",ex:"Sampling was used to select 40 invoices for testing out of 2,000.",note:"母集団の一部を抽出して検討し、母集団全体についての結論を導く方法。"},
{id:26,term:"cut-off",pos:"noun",cat:"process",ja:"期間帰属",def:"The principle that transactions are recorded in the correct accounting period.",ex:"Cut-off testing confirmed that December shipments were recorded in the correct year.",note:"取引が正しい会計期間に記録されているかという論点、およびそれを確かめる手続。"},
{id:27,term:"roll-forward",pos:"noun",cat:"process",ja:"ロールフォワード",def:"Updating audit procedures performed at an interim date to the balance sheet date.",ex:"The auditor rolled forward the interim testing results to year-end.",note:"期中に実施した監査手続の結果を期末日まで更新し、残りの期間の変動を検討する手続。"},
{id:28,term:"audit evidence",pos:"noun phrase",cat:"process",ja:"監査証拠",def:"Information used by the auditor to arrive at the conclusions on which the opinion is based.",ex:"Sufficient and appropriate audit evidence supports the audit opinion.",note:"監査人が意見の基礎となる結論を導くために利用する情報全般。"},
{id:29,term:"audit trail",pos:"noun phrase",cat:"process",ja:"監査証跡",def:"A chronological record that traces transactions from source to final entry.",ex:"The audit trail allowed the auditor to follow the transaction from the invoice to the general ledger.",note:"取引が発生から記帳、財務諸表への反映に至るまでを追跡できる記録の連鎖。"},

{id:30,term:"audit risk",pos:"noun phrase",cat:"risk",ja:"監査リスク",def:"The risk that the auditor expresses an inappropriate opinion on materially misstated financial statements.",ex:"Audit risk is a function of the risk of material misstatement and detection risk.",note:"財務諸表に重要な虚偽表示があるにもかかわらず、監査人が誤った意見を表明してしまうリスク。"},
{id:31,term:"inherent risk",pos:"noun phrase",cat:"risk",ja:"固有リスク",def:"The susceptibility of an assertion to misstatement before considering related controls.",ex:"Inherent risk is higher for accounts involving significant estimates.",note:"内部統制の存在を考慮する前の、勘定科目やアサーションが本来的に持つ虚偽表示のリスク。"},
{id:32,term:"control risk",pos:"noun phrase",cat:"risk",ja:"統制リスク",def:"The risk that a misstatement will not be prevented or detected by internal control on a timely basis.",ex:"Control risk was assessed as low due to strong segregation of duties.",note:"内部統制によって虚偽表示が適時に防止または発見されないリスク。"},
{id:33,term:"detection risk",pos:"noun phrase",cat:"risk",ja:"発見リスク",def:"The risk that the auditor's procedures will not detect a misstatement that exists.",ex:"The auditor reduced detection risk by increasing the sample size.",note:"監査人が実施する手続によって、存在する虚偽表示を発見できないリスク。"},
{id:34,term:"materiality",pos:"noun",cat:"risk",ja:"重要性",def:"The magnitude of an omission or misstatement that could influence users' decisions.",ex:"Materiality was set at 5% of pre-tax income.",note:"財務諸表利用者の意思決定に影響を与える可能性のある虚偽表示の重要度。監査計画の基礎となる。"},
{id:35,term:"performance materiality",pos:"noun phrase",cat:"risk",ja:"手続実施上の重要性",def:"An amount set below overall materiality to reduce the risk that undetected misstatements aggregate to a material amount.",ex:"Performance materiality was set at 75% of overall materiality.",note:"未発見・未修正の虚偽表示の合計額が全体の重要性を超えるリスクを一定の低い水準に抑えるために設定する金額。"},
{id:36,term:"tolerable misstatement",pos:"noun phrase",cat:"risk",ja:"許容可能な虚偽表示",def:"The maximum misstatement in a population the auditor is willing to accept.",ex:"Tolerable misstatement for the sample was set at half of performance materiality.",note:"サンプリングにおいて、母集団に存在しても許容できると監査人が判断する虚偽表示の最大額。"},
{id:37,term:"professional skepticism",pos:"noun phrase",cat:"risk",ja:"職業的懐疑心",def:"An attitude that includes a questioning mind and a critical assessment of audit evidence.",ex:"Professional skepticism requires the auditor not to accept management's explanations at face value.",note:"監査証拠に矛盾がないか、経営者の説明に疑わしい点がないかを批判的に評価する姿勢。"},
{id:38,term:"fraud",pos:"noun",cat:"risk",ja:"不正",def:"An intentional act by one or more individuals to obtain an unjust or illegal advantage.",ex:"The investigation revealed that fraud had occurred through fictitious sales entries.",note:"不当または違法な利益を得るために意図的に行われる行為。誤謬(error)とは区別される。"},
{id:39,term:"fraud triangle",pos:"noun phrase",cat:"risk",ja:"不正のトライアングル",def:"A model explaining the three conditions generally present when fraud occurs: incentive, opportunity, and rationalization.",ex:"The fraud triangle helps auditors understand why employees might commit fraud.",note:"動機・プレッシャー、機会、正当化の3要素が揃うことで不正が発生しやすくなるという考え方。"},
{id:40,term:"misstatement",pos:"noun",cat:"risk",ja:"虚偽表示",def:"A difference between the amount, classification, or presentation of a reported item and what is required for fair presentation.",ex:"The misstatement resulted from an incorrect application of the revenue recognition standard.",note:"報告された金額や表示が、適正な財務諸表として要求される内容と異なっていること。"},
{id:41,term:"reasonable assurance",pos:"noun phrase",cat:"risk",ja:"合理的保証",def:"A high, but not absolute, level of assurance.",ex:"An audit provides reasonable assurance, not absolute assurance, that the financial statements are free of material misstatement.",note:"監査は絶対的な保証ではなく、高い水準ではあるが完全ではない保証を提供するという考え方。"},
{id:42,term:"sampling risk",pos:"noun phrase",cat:"risk",ja:"サンプリングリスク",def:"The risk that the auditor's conclusion based on a sample differs from the conclusion if the entire population were tested.",ex:"Sampling risk can be reduced by increasing the sample size.",note:"サンプルに基づく結論が、母集団全体を検討した場合の結論と異なってしまうリスク。"},
{id:43,term:"management override of controls",pos:"noun phrase",cat:"risk",ja:"経営者による内部統制の無効化",def:"The risk that management can circumvent controls that otherwise appear to be operating effectively.",ex:"Management override of controls is a presumed fraud risk in every audit.",note:"経営者が自らの権限を利用して、有効に機能している内部統制を無効化してしまうリスク。すべての監査で不正リスクとして推定される。"},

{id:44,term:"existence",pos:"noun",cat:"assertion",ja:"実在性",def:"The assertion that assets, liabilities, and equity interests actually exist.",ex:"Physical inspection of equipment tested the existence assertion.",note:"資産や負債が実際に存在するという経営者の主張(アサーション)。"},
{id:45,term:"completeness",pos:"noun",cat:"assertion",ja:"網羅性",def:"The assertion that all transactions and balances that should have been recorded have been recorded.",ex:"Tracing shipping documents to sales invoices tested completeness.",note:"記録すべき取引や残高がすべて漏れなく記録されているという主張。"},
{id:46,term:"valuation and allocation",pos:"noun phrase",cat:"assertion",ja:"評価の妥当性",def:"The assertion that assets, liabilities, and equity are included at appropriate amounts.",ex:"Recalculating the allowance for doubtful accounts tested valuation and allocation.",note:"資産、負債、資本が適切な金額で計上されているという主張。"},
{id:47,term:"rights and obligations",pos:"noun phrase",cat:"assertion",ja:"権利と義務",def:"The assertion that the entity holds the rights to assets and owes the recorded obligations.",ex:"Reviewing the title deed confirmed the rights and obligations assertion for the property.",note:"記録されている資産に対する権利や負債に対する義務が実際に会社に帰属しているという主張。"},
{id:48,term:"accuracy",pos:"noun",cat:"assertion",ja:"正確性",def:"The assertion that amounts and other data have been recorded appropriately.",ex:"Recalculating the invoice totals tested the accuracy assertion.",note:"金額やその他のデータが適切な金額で正確に記録されているという主張。"},
{id:49,term:"occurrence",pos:"noun",cat:"assertion",ja:"発生",def:"The assertion that recorded transactions actually took place.",ex:"Vouching sales entries to shipping documents tested the occurrence assertion.",note:"記録されている取引が実際に発生したものであるという主張。"},
{id:50,term:"classification",pos:"noun",cat:"assertion",ja:"分類",def:"The assertion that transactions and events have been recorded in the proper accounts.",ex:"Reviewing the chart of accounts helped test classification.",note:"取引や事象が適切な勘定科目に分類・記録されているという主張。"},
{id:51,term:"cutoff (assertion)",pos:"noun",cat:"assertion",ja:"期間帰属(アサーション)",def:"The assertion that transactions have been recorded in the correct accounting period.",ex:"Cutoff testing near year-end addressed the cutoff assertion.",note:"取引が正しい会計期間に記録されているという主張。"},
{id:52,term:"presentation and disclosure",pos:"noun phrase",cat:"assertion",ja:"表示と開示",def:"The assertion that items are appropriately presented, described, and disclosed in the financial statements.",ex:"Reviewing the notes to the financial statements tested presentation and disclosure.",note:"財務諸表の項目が適切に表示・記述・開示されているという主張。"},

{id:53,term:"balance sheet",pos:"noun",cat:"fs",ja:"貸借対照表",def:"A statement showing an entity's assets, liabilities, and equity at a point in time.",ex:"The balance sheet showed total assets of 10 billion yen.",note:"ある時点における企業の資産・負債・純資産の状況を示す財務諸表。"},
{id:54,term:"income statement",pos:"noun",cat:"fs",ja:"損益計算書",def:"A statement showing an entity's revenues, expenses, and profit or loss over a period.",ex:"Revenue on the income statement grew by 8% year over year.",note:"一定期間における企業の収益・費用・利益の状況を示す財務諸表。"},
{id:55,term:"cash flow statement",pos:"noun phrase",cat:"fs",ja:"キャッシュ・フロー計算書",def:"A statement showing cash inflows and outflows classified by operating, investing, and financing activities.",ex:"Operating cash flow on the cash flow statement exceeded net income.",note:"一定期間の資金の増減を営業・投資・財務活動に区分して示す財務諸表。"},
{id:56,term:"statement of changes in equity",pos:"noun phrase",cat:"fs",ja:"株主資本等変動計算書",def:"A statement showing changes in each component of equity during the period.",ex:"Dividends paid were disclosed in the statement of changes in equity.",note:"一定期間における純資産の各項目の変動を示す財務諸表。"},
{id:57,term:"notes to financial statements",pos:"noun phrase",cat:"fs",ja:"財務諸表の注記",def:"Supplementary information that provides additional detail and context to the financial statements.",ex:"The notes to the financial statements disclosed the accounting policies used.",note:"財務諸表本体を補足する、会計方針や詳細情報などを記載した部分。"},
{id:58,term:"accrual basis",pos:"noun phrase",cat:"fs",ja:"発生主義",def:"An accounting method that records revenues and expenses when they are earned or incurred, not when cash changes hands.",ex:"Under the accrual basis, revenue is recognized when goods are delivered, not when cash is received.",note:"現金の収支ではなく、収益や費用が発生した時点で認識する会計上の考え方。"},
{id:59,term:"depreciation",pos:"noun",cat:"fs",ja:"減価償却(有形固定資産)",def:"The systematic allocation of the cost of a tangible fixed asset over its useful life.",ex:"Depreciation expense for the machinery was calculated using the straight-line method.",note:"有形固定資産の取得原価を、その耐用年数にわたって規則的に費用配分する会計処理。"},
{id:60,term:"amortization",pos:"noun",cat:"fs",ja:"償却(無形固定資産)",def:"The systematic allocation of the cost of an intangible asset over its useful life.",ex:"The amortization of the software license was recorded monthly.",note:"無形固定資産の取得原価を、その耐用年数にわたって規則的に費用配分する会計処理。"},
{id:61,term:"impairment",pos:"noun",cat:"fs",ja:"減損",def:"A permanent reduction in the recoverable value of an asset below its carrying amount.",ex:"The company recognized an impairment loss on the underperforming subsidiary.",note:"資産の回収可能価額が帳簿価額を下回り、その価値が実質的に減少していること。"},
{id:62,term:"goodwill",pos:"noun",cat:"fs",ja:"のれん",def:"The excess of the purchase price over the fair value of identifiable net assets acquired in a business combination.",ex:"Goodwill arising from the acquisition was tested annually for impairment.",note:"企業買収において、取得価額が識別可能な純資産の公正価値を上回る部分。"},
{id:63,term:"provision",pos:"noun",cat:"fs",ja:"引当金",def:"A liability of uncertain timing or amount recognized based on a present obligation.",ex:"A provision for warranty claims was recorded based on historical claim rates.",note:"支払いの時期や金額が不確実であるものの、現在の義務に基づいて認識される負債。"},
{id:64,term:"contingent liability",pos:"noun phrase",cat:"fs",ja:"偶発債務",def:"A potential obligation that depends on the outcome of a future uncertain event.",ex:"The pending lawsuit was disclosed as a contingent liability in the notes.",note:"将来の不確実な事象の結果によって発生するかどうかが決まる、現時点では確定していない債務。"},
{id:65,term:"deferred tax",pos:"noun phrase",cat:"fs",ja:"繰延税金",def:"Tax effects of temporary differences between the carrying amount of assets or liabilities and their tax basis.",ex:"A deferred tax asset was recognized for the unused tax loss carryforward.",note:"会計上と税務上の資産・負債の差異(一時差異)から生じる将来の税金への影響を財務諸表に反映させたもの。"},
{id:66,term:"consolidated financial statements",pos:"noun phrase",cat:"fs",ja:"連結財務諸表",def:"Financial statements presenting the financial position and results of a parent and its subsidiaries as a single economic entity.",ex:"The consolidated financial statements combined the results of all ten subsidiaries.",note:"親会社とその子会社を単一の組織体とみなして作成する財務諸表。"},
{id:67,term:"subsequent events",pos:"noun phrase",cat:"fs",ja:"後発事象",def:"Events occurring between the balance sheet date and the date the financial statements are issued.",ex:"A subsequent event was disclosed relating to a major customer's bankruptcy filing in January.",note:"決算日後から財務諸表が発行されるまでの間に発生した事象。財務諸表への影響を検討する必要がある。"},
{id:68,term:"related party transactions",pos:"noun phrase",cat:"fs",ja:"関連当事者取引",def:"Transactions between an entity and parties with significant influence over, or common control with, the entity.",ex:"Related party transactions with the CEO's family business were disclosed in the notes.",note:"会社と、その会社に対して重要な影響力を持つ者などとの間で行われる取引。"},
{id:69,term:"fair value",pos:"noun phrase",cat:"fs",ja:"公正価値",def:"The price that would be received to sell an asset in an orderly transaction between market participants.",ex:"The investment securities were remeasured at fair value at year-end.",note:"市場参加者間の秩序ある取引において資産を売却する際に受け取るであろう価格。"},
{id:70,term:"historical cost",pos:"noun phrase",cat:"fs",ja:"取得原価",def:"The original monetary value of an asset at the time it was acquired.",ex:"The building is recorded at historical cost less accumulated depreciation.",note:"資産を取得した時点での実際の支払対価。"},
{id:71,term:"accounts receivable",pos:"noun phrase",cat:"fs",ja:"売掛金",def:"Amounts owed to a company by customers for goods or services delivered on credit.",ex:"Accounts receivable increased due to slower customer payments.",note:"商品やサービスを掛けで販売したことにより生じる、顧客に対する債権。"},
{id:72,term:"accounts payable",pos:"noun phrase",cat:"fs",ja:"買掛金",def:"Amounts a company owes to its suppliers for goods or services purchased on credit.",ex:"Accounts payable was confirmed by comparing supplier statements to the recorded balance.",note:"商品やサービスを掛けで仕入れたことにより生じる、仕入先に対する債務。"},
{id:73,term:"allowance for doubtful accounts",pos:"noun phrase",cat:"fs",ja:"貸倒引当金",def:"A contra-asset account estimating the portion of receivables expected to be uncollectible.",ex:"The allowance for doubtful accounts was increased based on the aging analysis.",note:"売掛金のうち回収不能と見込まれる金額をあらかじめ見積もって計上する評価性引当金。"},

{id:74,term:"internal control",pos:"noun phrase",cat:"control",ja:"内部統制",def:"A process designed to provide reasonable assurance regarding the reliability of financial reporting, effectiveness of operations, and compliance with laws.",ex:"Internal control over the cash disbursement process included dual signature requirements.",note:"財務報告の信頼性、業務の有効性・効率性、法令遵守を確保するために企業内に整備される仕組み。"},
{id:75,term:"internal control over financial reporting (ICFR)",pos:"noun phrase",cat:"control",ja:"財務報告に係る内部統制",def:"Controls specifically designed to provide reasonable assurance regarding the reliability of financial reporting.",ex:"Management assessed the effectiveness of internal control over financial reporting as of year-end.",note:"財務諸表の信頼性を確保することを目的とした内部統制。日本のJ-SOXや米国のSOX法で評価が求められる。"},
{id:76,term:"control environment",pos:"noun phrase",cat:"control",ja:"統制環境",def:"The set of standards, processes, and structures that provide the foundation for carrying out internal control.",ex:"A strong control environment starts with tone at the top.",note:"内部統制の基盤となる、組織の気風や経営者の姿勢などを含む土台の部分。"},
{id:77,term:"segregation of duties",pos:"noun phrase",cat:"control",ja:"職務分掌",def:"Dividing responsibilities among different people to reduce the risk of error or fraud.",ex:"Segregation of duties ensured that the person recording cash receipts was not also reconciling the bank account.",note:"一人の担当者にすべての権限や職務を集中させず、複数人で分担することで不正や誤謬のリスクを減らす仕組み。"},
{id:78,term:"authorization",pos:"noun",cat:"control",ja:"承認",def:"Approval given by an appropriate level of management before a transaction is executed.",ex:"Purchases over 1 million yen required authorization from the finance director.",note:"取引が実行される前に、適切な権限を持つ者による承認を得ること。"},
{id:79,term:"reconciliation",pos:"noun",cat:"control",ja:"照合・調整",def:"The process of matching two sets of records to ensure they are in agreement and explaining any differences.",ex:"The bank reconciliation identified two outstanding checks.",note:"二つの記録を突き合わせ、一致しているかを確認し、差異があればその原因を説明するプロセス。"},
{id:80,term:"monitoring",pos:"noun",cat:"control",ja:"モニタリング",def:"Ongoing evaluations to ascertain whether internal controls are present and functioning.",ex:"Monitoring activities included periodic internal audits of the purchasing cycle.",note:"内部統制が適切に整備・運用されているかを継続的に評価する活動。COSOフレームワークの構成要素の一つ。"},
{id:81,term:"risk assessment",pos:"noun phrase",cat:"control",ja:"リスク評価",def:"The process of identifying and analyzing risks relevant to achieving the entity's objectives.",ex:"Management's risk assessment identified cybersecurity as an emerging risk.",note:"企業目標の達成を阻害する要因を識別し分析するプロセス。COSOの内部統制構成要素の一つ。"},
{id:82,term:"whistleblower",pos:"noun",cat:"control",ja:"内部告発者",def:"A person who reports suspected wrongdoing within an organization.",ex:"The whistleblower reported the accounting irregularities through the anonymous hotline.",note:"組織内の不正行為や違反を通報する者。内部通報制度は不正発見の重要な端緒となる。"},

{id:83,term:"independence",pos:"noun",cat:"ethics",ja:"独立性",def:"Freedom from relationships that would impair the auditor's objectivity.",ex:"The audit firm assessed its independence before accepting the engagement.",note:"監査人が被監査会社との間に、判断の客観性を損なうような利害関係を持たないこと。"},
{id:84,term:"due professional care",pos:"noun phrase",cat:"ethics",ja:"正当な注意",def:"The exercise of the skill and diligence expected of a competent auditor.",ex:"Due professional care requires the auditor to be diligent and thorough throughout the engagement.",note:"監査業務において、職業的専門家として通常期待される程度の注意深さと熱心さをもって業務を行うこと。"},
{id:85,term:"objectivity",pos:"noun",cat:"ethics",ja:"客観性",def:"A state of mind that reflects impartiality and freedom from conflicts of interest.",ex:"Objectivity requires the auditor not to allow bias to override professional judgment.",note:"偏見や利害の対立に影響されずに公正な判断を行う姿勢。"},
{id:86,term:"integrity",pos:"noun",cat:"ethics",ja:"誠実性",def:"Being straightforward and honest in all professional and business relationships.",ex:"Integrity is one of the fundamental principles in the code of ethics for professional accountants.",note:"すべての業務上の関係において、正直かつ率直であること。職業倫理の基本原則の一つ。"},
{id:87,term:"confidentiality",pos:"noun",cat:"ethics",ja:"守秘義務",def:"The obligation to protect client information from unauthorized disclosure or use.",ex:"Confidentiality prevents the auditor from disclosing client information without proper authority.",note:"業務上知り得た情報を、正当な権限なく第三者に開示したり自己の利益のために利用したりしない義務。"},
{id:88,term:"engagement letter",pos:"noun phrase",cat:"ethics",ja:"監査契約書",def:"A letter documenting the terms of the audit engagement agreed between the auditor and the client.",ex:"The engagement letter outlined the scope, responsibilities, and fees for the audit.",note:"監査業務の範囲や監査人・経営者双方の責任、報酬などの条件を記載し、監査契約時に取り交わす文書。"},
{id:89,term:"working papers",pos:"noun phrase",cat:"ethics",ja:"監査調書",def:"The record of audit procedures performed, evidence obtained, and conclusions reached.",ex:"The working papers documented the basis for the auditor's conclusions on inventory valuation.",note:"実施した監査手続、入手した監査証拠、および到達した結論の記録。監査意見の根拠を示す重要な文書。"},
{id:90,term:"engagement partner",pos:"noun phrase",cat:"ethics",ja:"業務執行社員",def:"The partner responsible for the audit engagement and its performance.",ex:"The engagement partner reviewed and signed the final audit report.",note:"監査業務の実施及び監査報告書に対して責任を負う社員(パートナー)。"},
{id:91,term:"quality control",pos:"noun phrase",cat:"ethics",ja:"品質管理",def:"Policies and procedures designed to provide reasonable assurance that engagements comply with professional standards.",ex:"The firm's quality control system included a mandatory engagement quality review.",note:"監査業務が職業的な基準や適用される法令等に準拠して実施されることについて合理的な保証を得るための方針と手続。"},
{id:92,term:"peer review",pos:"noun phrase",cat:"ethics",ja:"品質管理レビュー",def:"An independent review of a firm's audit practice to assess compliance with professional standards.",ex:"The firm underwent a peer review conducted by the professional accounting body.",note:"監査事務所の業務の質を、外部の第三者や事務所内の独立した部門が評価する制度。"},
{id:93,term:"group audit",pos:"noun phrase",cat:"ethics",ja:"グループ監査",def:"An audit of financial statements that include the financial information of more than one component.",ex:"The group audit involved coordination with auditors in five different countries.",note:"親会社と複数の子会社などから構成されるグループ全体の財務諸表に対する監査。"},
{id:94,term:"component auditor",pos:"noun phrase",cat:"ethics",ja:"構成単位の監査人",def:"An auditor who performs work on the financial information of a component for a group audit.",ex:"The group engagement team relied on the work of the component auditor in Vietnam.",note:"グループ監査において、特定の子会社等(構成単位)の監査を担当する監査人。"}
];

["IFRS 13","noun phrase","ifrs","IFRS第13号(公正価値測定)","The IFRS standard that defines fair value and sets the framework for measuring it.","IFRS 13 requires disclosure of the fair value hierarchy.","公正価値の定義と、レベル1〜3のヒエラルキーを定める。","公正価値を定義し、その測定の枠組みを定めたIFRSの基準。","IFRS 13は、公正価値ヒエラルキーの開示を求めている。"],
["IFRS 3","noun phrase","ifrs","IFRS第3号(企業結合)","The IFRS standard on accounting for business combinations.","Goodwill was measured in accordance with IFRS 3.","取得法を用いる。取得した資産・負債を公正価値で測定し、のれんを算定する。","企業結合の会計処理を定めたIFRSの基準。","のれんは、IFRS 3に従って測定された。"],
["IFRS 10","noun phrase","ifrs","IFRS第10号(連結財務諸表)","The IFRS standard that defines control and requires consolidated financial statements.","Under IFRS 10, an investor consolidates an entity that it controls.","連結の範囲を決める『支配』の判断が、中心となる。","支配を定義し、連結財務諸表の作成を求めるIFRSの基準。","IFRS 10では、投資者は、支配している企業を連結する。"],
["IFRS 5","noun phrase","ifrs","IFRS第5号(売却目的保有の非流動資産・非継続事業)","The IFRS standard on non-current assets held for sale and discontinued operations.","The assets were reclassified as held for sale under IFRS 5.","売却目的で保有する資産は、帳簿価額と売却費用控除後の公正価値のいずれか低い額で測定し、減価償却を停止する。","売却目的で保有する非流動資産と、非継続事業に関するIFRSの基準。","その資産は、IFRS 5に基づいて、売却目的保有に振り替えられた。"],
["IFRS 2","noun phrase","ifrs","IFRS第2号(株式に基づく報酬)","The IFRS standard on share-based payment.","Stock option expense is recorded under IFRS 2.","付与日の公正価値で測定し、権利確定期間にわたって費用処理する。","株式に基づく報酬に関するIFRSの基準。","ストック・オプションの費用は、IFRS 2に基づいて記録される。"],
["IFRS 7","noun phrase","ifrs","IFRS第7号(金融商品:開示)","The IFRS standard that requires disclosures about financial instruments and their risks.","IFRS 7 requires disclosure of credit risk, liquidity risk, and market risk.","信用リスク、流動性リスク、市場リスクの開示が、求められる。","金融商品とそのリスクに関する開示を求めるIFRSの基準。","IFRS 7は、信用リスク、流動性リスク、市場リスクの開示を求めている。"],
["IFRS 8","noun phrase","ifrs","IFRS第8号(事業セグメント)","The IFRS standard on disclosure of operating segments.","Segment information is disclosed under IFRS 8.","経営者が経営管理に用いている区分に基づいて、開示する(マネジメント・アプローチ)。","事業セグメントの開示に関するIFRSの基準。","セグメント情報は、IFRS 8に基づいて開示される。"],
["IAS 1","noun phrase","ifrs","IAS第1号(財務諸表の表示)","The standard that sets out the overall requirements for presenting financial statements.","IAS 1 requires a statement of financial position and a statement of comprehensive income.","『IAS』は International Accounting Standards の略。財務諸表の全般的な表示の要求事項を定める。","財務諸表の表示に関する全般的な要求事項を定めた基準。","IAS 1は、財政状態計算書と包括利益計算書を求めている。"],
["IAS 2","noun phrase","ifrs","IAS第2号(棚卸資産)","The standard on inventories, measured at the lower of cost and net realizable value.","Inventories are measured in accordance with IAS 2.","取得原価と正味実現可能価額のいずれか低い額で測定する。","棚卸資産に関する基準。取得原価と正味実現可能価額のいずれか低い額で測定する。","棚卸資産は、IAS 2に従って測定される。"],
["IAS 7","noun phrase","ifrs","IAS第7号(キャッシュ・フロー計算書)","The standard on statements of cash flows.","The cash flow statement was prepared in accordance with IAS 7.","営業・投資・財務の3つの活動に区分して表示する。","キャッシュ・フロー計算書に関する基準。","キャッシュ・フロー計算書は、IAS 7に準拠して作成された。"],
["IAS 8","noun phrase","ifrs","IAS第8号(会計方針、会計上の見積りの変更及び誤謬)","The standard on accounting policies, changes in estimates, and errors.","A change in policy is applied retrospectively under IAS 8.","会計方針の変更は遡及適用、見積りの変更は将来に向かって適用する。","会計方針、見積りの変更、および誤謬に関する基準。","IAS 8の下では、会計方針の変更は遡及適用される。"],
["IAS 10","noun phrase","ifrs","IAS第10号(後発事象)","The standard on events after the reporting period.","Adjusting events are reflected in the financial statements under IAS 10.","決算日後に生じた事象のうち、決算日の状況を示すものは修正し、そうでないものは開示する。","報告期間後の事象に関する基準。","修正を要する事象は、IAS 10に基づいて、財務諸表に反映される。"],
["IAS 12","noun phrase","ifrs","IAS第12号(法人所得税)","The standard on accounting for income taxes, including deferred tax.","Deferred tax assets are recognized under IAS 12 only when recovery is probable.","繰延税金の認識の要件が定められている。","繰延税金を含む、法人所得税の会計処理を定めた基準。","IAS 12の下では、回収の可能性が高い場合にのみ、繰延税金資産が認識される。"],
["IAS 16","noun phrase","ifrs","IAS第16号(有形固定資産)","The standard on property, plant and equipment.","Depreciation is calculated under IAS 16.","原価モデルまたは再評価モデルを選択できる。","有形固定資産に関する基準。","減価償却費は、IAS 16に基づいて計算される。"],
["IAS 21","noun phrase","ifrs","IAS第21号(外国為替レートの変動の影響)","The standard on the effects of changes in foreign exchange rates.","Translation differences are recognized under IAS 21.","機能通貨で取引を測定し、表示通貨に換算する。","外国為替レートの変動の影響に関する基準。","換算差額は、IAS 21に基づいて認識される。"],
["IAS 24","noun phrase","ifrs","IAS第24号(関連当事者についての開示)","The standard that requires disclosure of related party relationships and transactions.","IAS 24 requires disclosure of key management compensation.","主要な経営幹部の報酬の開示も、求められる。","関連当事者の関係と取引の開示を求める基準。","IAS 24は、主要な経営幹部の報酬の開示を求めている。"],
["IAS 36","noun phrase","ifrs","IAS第36号(資産の減損)","The standard that requires assets to be tested for impairment.","Goodwill is tested annually under IAS 36.","資産の帳簿価額が回収可能価額を超えないようにする。のれんは毎年テストする。","資産の減損テストを求める基準。","のれんは、IAS 36に基づいて、毎年減損テストが行われる。"],
["IAS 37","noun phrase","ifrs","IAS第37号(引当金、偶発負債及び偶発資産)","The standard on provisions, contingent liabilities, and contingent assets.","A provision is recognized under IAS 37 when an outflow of resources is probable.","引当金は、現在の義務があり、資源の流出の可能性が高く、金額を信頼性をもって見積れる場合に認識する。","引当金、偶発負債、偶発資産に関する基準。","IAS 37では、資源の流出の可能性が高い場合に、引当金が認識される。"],
["IAS 38","noun phrase","ifrs","IAS第38号(無形資産)","The standard on intangible assets.","Development costs are capitalized under IAS 38 if the criteria are met.","研究費は費用処理し、開発費は要件を満たした場合に資産計上する。","無形資産に関する基準。","開発費は、要件を満たす場合に、IAS 38に基づいて資産計上される。"],
["reporting period","noun phrase","ifrs","報告期間","The period covered by a set of financial statements.","Events after the reporting period were evaluated.","IFRSでは『期末日』を the end of the reporting period と呼ぶ。","一組の財務諸表が対象とする期間。","報告期間後の事象が、評価された。"],
["functional currency","noun phrase","ifrs","機能通貨","The currency of the primary economic environment in which an entity operates.","The subsidiary's functional currency is the US dollar.","企業が主に事業を行う経済環境の通貨。海外子会社の換算で重要。","企業が事業を行う、主要な経済環境の通貨。","その子会社の機能通貨は、米ドルである。"],
["presentation currency","noun phrase","ifrs","表示通貨","The currency in which the financial statements are presented.","The presentation currency of the group is the Japanese yen.","財務諸表を表示する通貨。機能通貨と異なる場合は、換算が必要。","財務諸表が表示される通貨。","そのグループの表示通貨は、日本円である。"],
["principal versus agent","noun phrase","ifrs","本人か代理人か","The assessment of whether an entity controls goods before they are transferred, which decides gross or net revenue reporting.","The principal versus agent assessment determines whether revenue is reported gross or net.","本人なら総額、代理人なら手数料の純額で収益を計上する。収益認識の重要な論点。","企業が、財が移転する前にそれを支配しているかどうかの判断。総額表示か純額表示かが決まる。","本人か代理人かの判断により、収益が総額で報告されるか純額で報告されるかが決まる。"],
["variable consideration","noun phrase","ifrs","変動対価","The part of the transaction price that may change, such as rebates or bonuses.","Variable consideration is estimated and included in the transaction price.","値引き、リベート、業績ボーナスなど。見積りの不確実性が大きく、監査上の論点になる。","リベートやボーナスのように、変動する可能性がある、取引価格の部分。","変動対価は、見積もられて、取引価格に含められる。"],
["stand-alone selling price","noun phrase","ifrs","独立販売価格","The price at which an entity would sell a promised good or service separately to a customer.","The transaction price is allocated based on the stand-alone selling price of each good.","複数の履行義務がある契約で、取引価格を配分する基準となる。","約束した財やサービスを、企業が顧客に単独で販売するときの価格。","取引価格は、各財の独立販売価格に基づいて配分される。"],
["lease liability","noun phrase","ifrs","リース負債","The present value of the lease payments that a lessee has not yet paid.","The lease liability was measured using the incremental borrowing rate.","借手が、まだ支払っていないリース料の現在価値。割引率には、追加借入利子率を使うことが多い。","借手がまだ支払っていない、リース料の現在価値。","そのリース負債は、追加借入利子率を用いて測定された。"],
["fair value hierarchy","noun phrase","ifrs","公正価値ヒエラルキー","A three-level ranking of the inputs used to measure fair value.","The fair value hierarchy is disclosed in the notes.","レベル1(活発な市場の価格)から、レベル3(観察できないインプット)まで。","公正価値の測定に用いるインプットを、3段階に分けた序列。","公正価値ヒエラルキーは、注記に開示されている。"],
["Level 3 inputs","noun phrase","ifrs","レベル3のインプット","Unobservable inputs used to measure fair value when market data are not available.","Level 3 inputs require significant management judgment.","市場データがない場合に使う、観察できない仮定。監査上の重要な論点になる。","市場データがない場合に、公正価値の測定に用いる、観察できないインプット。","レベル3のインプットには、経営者の重要な判断が必要である。"],
["cash-generating unit (CGU)","noun phrase","ifrs","資金生成単位","The smallest group of assets that generates cash inflows largely independent of other assets.","Goodwill is allocated to each cash-generating unit for impairment testing.","減損テストを行う最小の単位。日本基準の『資産グループ』に相当する。","他の資産から、ほぼ独立してキャッシュ・インフローを生み出す、最小の資産グループ。","減損テストのために、のれんは各資金生成単位に配分される。"],

/* ===== 監査基準の語句(ISA・監基報) ===== */
["ISA 200","noun phrase","isa","ISA 200(独立した監査人の全般的な目的)","The standard that sets out the overall objectives of the independent auditor.","ISA 200 explains that an audit provides reasonable assurance, not absolute assurance.","日本の監査基準委員会報告書200に対応。合理的保証、職業的懐疑心、重要性などの基本概念を定める。","独立した監査人の全般的な目的を定めた基準。","ISA 200は、監査が絶対的な保証ではなく、合理的な保証を提供することを説明している。"],
["ISA 230","noun phrase","isa","ISA 230(監査調書)","The standard on audit documentation.","ISA 230 requires the auditor to prepare audit documentation on a timely basis.","日本の監基報230に対応。第三者が読んで、実施した手続と結論を理解できるように、調書を作成する。","監査調書に関する基準。","ISA 230は、監査人に、適時に監査調書を作成することを求めている。"],
["ISA 240","noun phrase","isa","ISA 240(財務諸表監査における不正)","The standard on the auditor's responsibilities relating to fraud.","ISA 240 requires the auditor to presume a fraud risk in revenue recognition.","日本の監基報240に対応。不正リスク対応基準で、収益認識に不正リスクがあると推定する。","財務諸表監査における、不正に関する監査人の責任を定めた基準。","ISA 240は、監査人に、収益認識に不正リスクがあると推定することを求めている。"],
["ISA 260","noun phrase","isa","ISA 260(統治責任者とのコミュニケーション)","The standard on communication with those charged with governance.","ISA 260 requires the auditor to communicate significant findings from the audit.","日本の監基報260に対応。監査の範囲や時期、重要な発見事項などを伝える。","統治責任者とのコミュニケーションに関する基準。","ISA 260は、監査人に、監査の重要な発見事項を伝えることを求めている。"],
["ISA 265","noun phrase","isa","ISA 265(内部統制の不備の伝達)","The standard on communicating deficiencies in internal control.","ISA 265 requires significant deficiencies to be communicated in writing.","日本の監基報265に対応。重要な不備は、書面で伝える。","内部統制の不備を、統治責任者と経営者に伝えることに関する基準。","ISA 265は、重要な不備を書面で伝えることを求めている。"],
["ISA 315","noun phrase","isa","ISA 315(重要な虚偽表示リスクの識別と評価)","The standard on identifying and assessing the risks of material misstatement.","ISA 315 requires the auditor to understand the entity and its internal control.","日本の監基報315に対応。リスク評価手続の中心となる基準。","重要な虚偽表示リスクの識別と評価に関する基準。","ISA 315は、監査人に、企業と内部統制を理解することを求めている。"],
["ISA 330","noun phrase","isa","ISA 330(評価したリスクに対する監査人の対応)","The standard on the auditor's responses to the assessed risks.","ISA 330 requires substantive procedures for each material class of transactions.","日本の監基報330に対応。リスク対応手続(統制のテストと実証手続)を定める。","評価したリスクに対する、監査人の対応に関する基準。","ISA 330は、重要な取引種類ごとに、実証手続を実施することを求めている。"],
["ISA 450","noun phrase","isa","ISA 450(識別した虚偽表示の評価)","The standard on evaluating misstatements identified during the audit.","ISA 450 requires the auditor to accumulate misstatements above a clearly trivial threshold.","日本の監基報450に対応。明らかに僅少な虚偽表示を除き、集計して評価する。","監査中に識別した虚偽表示の評価に関する基準。","ISA 450は、監査人に、明らかに僅少な水準を超える虚偽表示を集計することを求めている。"],
["ISA 500","noun phrase","isa","ISA 500(監査証拠)","The standard on audit evidence.","ISA 500 requires sufficient appropriate audit evidence to support the opinion.","日本の監基報500に対応。証拠の十分性と適切性(適合性・信頼性)を定める。","監査証拠に関する基準。","ISA 500は、意見を裏付ける、十分かつ適切な監査証拠を求めている。"],
["ISA 505","noun phrase","isa","ISA 505(外部確認)","The standard on external confirmations.","ISA 505 explains how to design and send external confirmation requests.","日本の監基報505に対応。確認状の送付と管理は、監査人自身が行う。","外部確認に関する基準。","ISA 505は、外部確認の要求の設計と送付の方法を説明している。"],
["ISA 520","noun phrase","isa","ISA 520(分析的手続)","The standard on analytical procedures.","ISA 520 requires analytical procedures near the end of the audit.","日本の監基報520に対応。監査の終了段階でも、全体的な結論のために行う。","分析的手続に関する基準。","ISA 520は、監査の終わり近くに、分析的手続を行うことを求めている。"],
["ISA 530","noun phrase","isa","ISA 530(監査サンプリング)","The standard on audit sampling.","ISA 530 covers both statistical and non-statistical sampling.","日本の監基報530に対応。サンプルの抽出、評価、虚偽表示の拡大推定を扱う。","監査サンプリングに関する基準。","ISA 530は、統計的および非統計的サンプリングの両方を扱っている。"],
["ISA 540","noun phrase","isa","ISA 540(会計上の見積りの監査)","The standard on auditing accounting estimates and related disclosures.","ISA 540 requires the auditor to evaluate management bias in estimates.","日本の監基報540に対応。見積りの不確実性、経営者の偏向、開示を扱う。","会計上の見積りと関連する開示の監査に関する基準。","ISA 540は、監査人に、見積りにおける経営者の偏向を評価することを求めている。"],
["ISA 550","noun phrase","isa","ISA 550(関連当事者)","The standard on related parties.","ISA 550 requires the auditor to identify related party relationships and transactions.","日本の監基報550に対応。関連当事者との取引は、不正リスクが高い。","関連当事者に関する基準。","ISA 550は、監査人に、関連当事者の関係と取引を識別することを求めている。"],
["ISA 570","noun phrase","isa","ISA 570(継続企業)","The standard on going concern.","ISA 570 requires the auditor to evaluate management's going concern assessment.","日本の監基報570に対応。経営者の評価と、重要な不確実性の有無を検討する。","継続企業に関する基準。","ISA 570は、監査人に、経営者の継続企業の評価を検討することを求めている。"],
["ISA 600","noun phrase","isa","ISA 600(グループ監査)","The standard on special considerations for audits of group financial statements.","ISA 600 requires the group engagement team to direct and review component auditors.","日本の監基報600に対応。構成単位の監査人の指示と監督を扱う。","グループ財務諸表の監査における、特別な考慮事項に関する基準。","ISA 600は、グループ監査チームに、構成単位の監査人への指示と査閲を求めている。"],
["ISA 700","noun phrase","isa","ISA 700(財務諸表に対する意見の形成と報告)","The standard on forming an opinion and reporting on financial statements.","ISA 700 sets out the structure of the standard auditor's report.","日本の監基報700に対応。監査報告書の構成と文言を定める。","財務諸表に対する意見の形成と報告に関する基準。","ISA 700は、標準的な監査報告書の構成を定めている。"],
["ISA 701","noun phrase","isa","ISA 701(監査上の主要な検討事項)","The standard on communicating key audit matters in the auditor's report.","ISA 701 applies to the audits of listed entities.","日本の監基報701に対応。上場会社の監査報告書に、KAMを記載する。","監査報告書における、監査上の主要な検討事項の報告に関する基準。","ISA 701は、上場企業の監査に適用される。"],
["ISA 705","noun phrase","isa","ISA 705(除外事項付意見)","The standard on modifications to the opinion in the auditor's report.","ISA 705 distinguishes between qualified, adverse, and disclaimer of opinion.","日本の監基報705に対応。限定付適正意見、不適正意見、意見不表明の区別を定める。","監査報告書における、意見の修正に関する基準。","ISA 705は、限定付適正意見、不適正意見、意見不表明を区別している。"],
["ISA 706","noun phrase","isa","ISA 706(強調事項区分とその他の事項区分)","The standard on emphasis of matter and other matter paragraphs.","ISA 706 explains when an emphasis of matter paragraph is added.","日本の監基報706に対応。意見には影響しないが、利用者に伝えるべき事項を記載する。","強調事項区分とその他の事項区分に関する基準。","ISA 706は、どのような場合に強調事項区分を追加するかを説明している。"],
["auditor's expert","noun phrase","isa","監査人の専門家","An individual or firm with expertise outside accounting and auditing whose work the auditor uses.","The auditor's expert valued the investment property.","不動産鑑定士、年金数理人など。監査人が、自らの業務に利用する専門家。","会計・監査以外の専門的な知識を持ち、監査人がその業務を利用する、個人または組織。","監査人の専門家が、投資不動産を評価した。"],
["management's expert","noun phrase","isa","経営者の利用する専門家","An expert whose work the entity uses to help prepare the financial statements.","The auditor evaluated the competence of management's expert.","会社が雇う年金数理人など。監査人は、その能力と客観性を評価する。","企業が、財務諸表の作成のために、その業務を利用する専門家。","監査人は、経営者の利用する専門家の能力を評価した。"],
["component materiality","noun phrase","isa","構成単位の重要性","Materiality set for a component of a group for the purpose of the group audit.","Component materiality was set lower than group materiality.","グループ全体の重要性より低く設定する。","グループ監査のために、グループの構成単位に設定する重要性。","構成単位の重要性は、グループの重要性よりも低く設定された。"],
["group engagement team","noun phrase","isa","グループ監査チーム","The partner and staff who establish the group audit strategy and conclude on the group financial statements.","The group engagement team visited the major subsidiary.","グループ監査の戦略を定め、構成単位の監査人を指揮する、親会社の監査チーム。","グループ監査の戦略を定め、グループ財務諸表について結論を出す、パートナーとスタッフ。","グループ監査チームは、主要な子会社を訪問した。"],
["service auditor","noun phrase","isa","受託会社監査人","An auditor who reports on controls at a service organization.","The service auditor issued a Type 2 report on the payroll provider.","受託会社の内部統制について報告する監査人。SOC 1 などの報告書を作成する。","受託会社の統制について、報告を行う監査人。","受託会社監査人は、給与計算の委託先について、タイプ2の報告書を発行した。"],
["significant component","noun phrase","isa","重要な構成単位","A component identified as individually significant to the group.","A full audit was performed on each significant component.","グループにとって個別に重要な子会社や事業部。重点的に監査する。","グループにとって個別に重要であると識別された、構成単位。","各重要な構成単位に対して、フルスコープの監査が実施された。"],

/* ===== 監査法人の実務・社内用語 ===== */
["PBC list","noun phrase","office","クライアント準備資料のリスト(PBCリスト)","A list of documents and information that the client prepares and provides to the audit team.","We sent the PBC list to the client two weeks before fieldwork.","PBCは Prepared By Client の略。監査開始前に、必要な資料を一覧にして依頼する。","クライアントが準備し、監査チームに提供する資料や情報の一覧。","往査の2週間前に、クライアントにPBCリストを送付した。"],
["review note","noun phrase","office","レビューコメント","A comment written by a reviewer on a working paper that the preparer must address.","The senior cleared all review notes before the partner review.","調書の査閲者が残すコメント。作成者が対応(クリア)して初めて、調書が完成する。","調書の査閲者が書き込む、作成者が対応しなければならないコメント。","シニアは、パートナーのレビューの前に、すべてのレビューコメントを解消した。"],
["sign-off","noun","office","承認・サインオフ","Formal approval given after reviewing work.","The manager's sign-off is required before the report is issued.","調書や報告書に対する正式な承認。『サインオフする』は sign off と動詞でも使う。","作業を確認したあとに行う、正式な承認。","報告書を発行する前に、マネージャーのサインオフが必要である。"],
["tick mark","noun phrase","office","チェックマーク(確認記号)","A symbol on a working paper showing which procedure was performed on an item.","Each amount has a tick mark showing it was agreed to the invoice.","調書の各項目に付ける記号。凡例(legend)に、各記号の意味を書いておく。","調書上で、ある項目にどの手続を実施したかを示す記号。","各金額には、請求書と照合したことを示すチェックマークが付いている。"],
["audit staff","noun phrase","office","スタッフ(若手の監査担当者)","A junior member of the audit team who performs detailed testing.","The audit staff tested 25 samples of purchase invoices.","監査法人の最も若い階層。詳細なテストや調書の作成を担当する。","詳細なテストを行う、監査チームの若手メンバー。","スタッフは、購買請求書のサンプル25件をテストした。"],
["in-charge","noun","office","インチャージ(現場責任者)","The team member who leads the fieldwork day to day at the client's site.","The in-charge assigns tasks to the staff each morning.","現場の責任者。シニアが務めることが多く、作業の割り振りと進捗管理を行う。","クライアント先で、日々の作業を指揮するチームメンバー。","インチャージは、毎朝、スタッフに作業を割り振る。"],
["audit manager","noun phrase","office","監査マネージャー","A senior member who reviews the work and manages the engagement day to day.","The audit manager reviewed the working papers before they went to the partner.","シニアとパートナーの間の階層。チームを管理し、調書を査閲する。","作業を査閲し、業務を日々管理する上級メンバー。","監査マネージャーは、調書をパートナーに回す前に査閲した。"],
["partner review","noun phrase","office","パートナーレビュー","The final review of the audit file by the engagement partner.","The partner review is scheduled for the second week of May.","業務執行社員による最終的な査閲。この前に、すべてのレビューコメントを解消しておく。","業務執行社員が行う、監査調書の最終的な査閲。","パートナーレビューは、5月の第2週に予定されている。"],
["busy season","noun phrase","office","繁忙期","The period with the heaviest audit workload, usually around the year-end closing.","During busy season, auditors often work long hours.","3月決算の会社が多い日本では、4月〜6月頃が繁忙期になる。","決算期の前後など、監査業務が最も忙しい期間。","繁忙期には、監査人は長時間働くことが多い。"],
["utilization rate","noun phrase","office","稼働率","The share of working hours charged to client engagements.","Her utilization rate was 85% this quarter.","勤務時間のうち、クライアントの業務に充てた時間の割合。人事評価の指標になることがある。","勤務時間のうち、クライアントの業務に充てた時間の割合。","今四半期の彼女の稼働率は、85%だった。"],
["billable hours","noun phrase","office","請求可能時間","Hours worked that can be charged to a client.","Billable hours are recorded in the timesheet.","クライアントに報酬として請求できる、実際の作業時間。","クライアントに請求できる、作業時間。","請求可能時間は、タイムシートに記録される。"],
["timesheet","noun","office","タイムシート(作業時間の記録)","A record of the hours an employee spends on each engagement.","Please submit your timesheet by Friday evening.","どの業務に何時間使ったかを記録する。報酬の請求と原価管理に使う。","従業員が、各業務に費やした時間の記録。","金曜日の夕方までに、タイムシートを提出してください。"],
["budget hours","noun phrase","office","予算時間","The number of hours planned for an engagement.","We exceeded the budget hours because of additional testing.","業務ごとに見積もる、計画上の作業時間。超過すると、理由の説明が必要になる。","業務のために計画された、作業時間の数。","追加のテストが必要になったため、予算時間を超過した。"],
["kick-off meeting","noun phrase","office","キックオフ会議","The first meeting that starts the audit and aligns the schedule.","We confirmed the schedule at the kick-off meeting.","監査開始時に、スケジュールや依頼資料、担当者を確認する会議。","監査を開始し、スケジュールをそろえるための最初の会議。","キックオフ会議で、スケジュールを確認した。"],
["exit meeting","noun phrase","office","終了時の会議(講評会議)","A closing meeting where the audit team discusses findings with management.","Key findings were discussed at the exit meeting.","往査の最後に、発見事項や未解決事項を経営者と話し合う会議。","監査チームが、発見事項を経営者と話し合う最後の会議。","主要な発見事項は、終了時の会議で話し合われた。"],
["deadline","noun","office","期限","The date by which work must be completed.","The deadline for the draft report is Friday.","『締切』。deadline を守ることが、実務では最も重視される。","作業を完了しなければならない期日。","報告書のドラフトの期限は、金曜日である。"],
["follow-up","noun","office","フォローアップ(追加確認)","An additional action taken after an initial request or finding.","We sent a follow-up to the client about the outstanding items.","最初の依頼や発見事項のあとに行う、追加の確認や連絡。","最初の依頼や発見事項のあとに取る、追加の対応。","未解決事項について、クライアントにフォローアップを送付した。"],
["outstanding items","noun phrase","office","未解決事項","Matters that have not yet been resolved or documented.","The outstanding items list was reviewed at the weekly meeting.","まだ資料が届いていない、または結論が出ていない事項。一覧表で管理する。","まだ解決または文書化されていない事項。","未解決事項の一覧は、週次の会議で確認された。"],
["query","noun","office","質問事項・照会","A question asked to the client or a colleague.","The client responded to our query within two days.","クライアントへの質問は、記録して管理し、回答を調書に残す。","クライアントや同僚に対する質問。","クライアントは、私たちの質問に2日以内に回答した。"],
["supporting documents","noun phrase","office","証憑書類","Documents that back up a transaction.","Supporting documents were attached to each journal entry.","請求書、契約書、納品書など、取引を裏付ける資料。","取引を裏付ける書類。","各仕訳には、証憑書類が添付されていた。"],
["source document","noun phrase","office","原始証憑","The original document that records a transaction, such as an invoice.","We traced the entry to the source document.","取引が最初に記録された文書。突合の際に、最終的にたどり着く先。","請求書など、取引を最初に記録した原本の文書。","私たちは、その仕訳を原始証憑までたどった。"],
["invoice","noun","office","請求書","A document issued by a seller requesting payment for goods or services.","The invoice was dated December 28.","売上と仕入の、最も基本的な証憑。日付と金額、宛先を確認する。","商品やサービスの代金を請求するために、売手が発行する書類。","その請求書の日付は、12月28日だった。"],
["purchase order","noun phrase","office","発注書","A document issued by a buyer to order goods or services.","The purchase order was approved before the goods were received.","購買プロセスの統制として、発注と承認の関係を確認する。","商品やサービスを注文するために、買手が発行する書類。","その発注書は、商品を受け取る前に承認されていた。"],
["delivery note","noun phrase","office","納品書","A document showing that goods have been delivered to the customer.","The delivery note was signed by the customer on December 30.","売上の期間帰属(カットオフ)を確認する際に、重要な資料になる。","商品が顧客に引き渡されたことを示す書類。","その納品書には、12月30日に、顧客が署名していた。"],
["bank statement","noun phrase","office","銀行残高明細書","A statement issued by a bank showing transactions and the balance of an account.","The bank statement was compared with the cash book.","銀行勘定調整表を作る際に、帳簿残高と突き合わせる。","口座の取引と残高を示す、銀行が発行する書類。","銀行残高明細書は、現金出納帳と照合された。"],
["board minutes","noun phrase","office","取締役会議事録","The written record of what was discussed and decided at board meetings.","We read the board minutes for evidence of related party transactions.","重要な契約、訴訟、不正の兆候を探すために読み込む。","取締役会で議論され、決定されたことの、書面の記録。","私たちは、関連当事者取引の手がかりを探して、取締役会議事録を読んだ。"],
["deliverable","noun","office","成果物","A document or output that must be provided to the client.","The draft report is the main deliverable.","クライアントに提出する報告書、資料などの成果物。","クライアントに提供しなければならない、書類やアウトプット。","報告書のドラフトが、主な成果物である。"],
["handover","noun","office","引継ぎ","The transfer of responsibilities to another person.","The in-charge prepared a handover note before leaving.","担当者が替わるときの引継ぎ。前年度の調書や論点をまとめる。","責任を他の人に移すこと。","インチャージは、離れる前に、引継ぎのメモを作成した。"],
["financial close","noun phrase","office","決算","The process of finalizing accounts at the end of a reporting period.","The financial close was completed ten days after the balance sheet date.","決算日後に、会社が帳簿を締めて財務諸表を作る一連のプロセス。","報告期間の終わりに、会計記録を確定するプロセス。","決算は、貸借対照表日の10日後に完了した。"],

/* ===== 業種別の用語 ===== */
["net interest income","noun phrase","industry","純受取利息(資金利益)","Interest earned on loans and securities minus interest paid on deposits and borrowings.","Net interest income is the main source of profit for the bank.","銀行業の中心的な収益指標。貸出金利と預金金利の差が収益になる。","貸出金や有価証券から得る利息から、預金や借入金に支払う利息を差し引いたもの。","純受取利息は、その銀行の主な利益の源泉である。"],
["non-performing loan (NPL)","noun phrase","industry","不良債権","A loan on which the borrower has stopped making payments as agreed.","Non-performing loans increased due to the economic slowdown.","元本や利息の支払が滞っている貸出金。貸倒引当金の見積りが、監査上の最重要論点。","借手が、約束どおりの支払をやめてしまった貸出金。","景気の減速により、不良債権が増加した。"],
["capital adequacy ratio","noun phrase","industry","自己資本比率(銀行)","A bank's capital divided by its risk-weighted assets.","The capital adequacy ratio exceeded the regulatory minimum.","銀行の健全性を示す規制上の指標。国際基準では8%以上が求められる。","銀行の自己資本を、リスク・ウェイト調整後の資産で割ったもの。","自己資本比率は、規制上の最低水準を上回っていた。"],
["deposits","noun","industry","預金","Money placed with a bank by customers, which the bank owes back to them.","Deposits are the bank's largest liability.","銀行にとっては、預かった金額が負債になる。","顧客が銀行に預けた、銀行が返済義務を負う資金。","預金は、その銀行の最大の負債である。"],
["insurance contract","noun phrase","industry","保険契約","A contract under which one party accepts significant insurance risk from another party.","Revenue from the insurance contract is recognized over the coverage period.","保険会社が、保険事故が起こったときに保険金を支払うことを約束する契約。IFRS 17が適用される。","一方の当事者が、他方の当事者から、重要な保険リスクを引き受ける契約。","保険契約からの収益は、保険期間にわたって認識される。"],
["policy reserve","noun phrase","industry","責任準備金","A liability set aside by an insurer to pay future claims.","The policy reserve is calculated by an actuary.","保険会社が、将来の保険金の支払のために積み立てる負債。年金数理人が見積もる。","保険会社が、将来の保険金の支払のために、確保しておく負債。","責任準備金は、年金数理人によって計算される。"],
["premium","noun","industry","保険料","The amount a policyholder pays to an insurer for coverage.","Premium income increased by 6% compared with the prior year.","保険契約者が、保険会社に支払う対価。","契約者が、補償を受けるために保険会社に支払う金額。","保険料収入は、前年に比べて6%増加した。"],
["reinsurance","noun","industry","再保険","Insurance purchased by an insurer to transfer part of its risk to another insurer.","The company used reinsurance to reduce its exposure to large losses.","保険会社が、自社のリスクの一部を、他の保険会社に移転するために購入する保険。","保険会社が、リスクの一部を別の保険会社に移すために購入する保険。","その会社は、大きな損失へのエクスポージャーを減らすために、再保険を利用した。"],
["work in process","noun phrase","industry","仕掛品","Goods that are partially completed and still in production.","Work in process was valued at cost plus allocated overhead.","製造の途中にある製品。原価の見積りと完成度の判断が、論点になる。","製造の途中にあり、まだ完成していない製品。","仕掛品は、原価に配賦された間接費を加えた額で評価された。"],
["raw materials","noun phrase","industry","原材料","Basic materials used in production before they are processed.","Raw materials are counted at the warehouse every year-end.","製品を作るために購入した、加工前の材料。","加工される前の、生産に使用される基本的な材料。","原材料は、毎年の期末に、倉庫で実地棚卸が行われる。"],
["finished goods","noun phrase","industry","製品","Completed products that are ready for sale.","Finished goods are measured at the lower of cost and net realizable value.","完成して、販売できる状態にある製品。滞留在庫の評価減に注意する。","完成していて、販売の準備ができている製品。","製品は、取得原価と正味売却価額のいずれか低い額で測定される。"],
["standard cost","noun phrase","industry","標準原価","A predetermined cost per unit used for planning and valuing inventory.","Standard cost is compared with actual cost to identify variances.","あらかじめ設定した原価。実際の原価との差(原価差異)を分析する。","計画や在庫評価のために用いる、あらかじめ決めた1単位当たりの原価。","差異を識別するために、標準原価が実際の原価と比較される。"],
["manufacturing overhead","noun phrase","industry","製造間接費","Indirect factory costs such as utilities and equipment depreciation.","Manufacturing overhead is allocated to products based on machine hours.","工場の電気代や設備の減価償却費など、製品に直接結びつけられない原価。","光熱費や設備の減価償却費など、工場で生じる間接的な費用。","製造間接費は、機械の稼働時間に基づいて、製品に配賦される。"],
["cost variance","noun phrase","industry","原価差異","The difference between standard cost and actual cost.","The cost variance was allocated between inventory and cost of goods sold.","差異は、売上原価と期末在庫に配賦する。","標準原価と実際の原価との差。","原価差異は、棚卸資産と売上原価に配賦された。"],
["same-store sales","noun phrase","industry","既存店売上高","Sales from stores that have been open for at least a year.","Same-store sales grew by 3% year over year.","新規出店の影響を除いた、小売業の成長性の指標。","開店から1年以上たった店舗の売上高。","既存店売上高は、前年同期比で3%増加した。"],
["shrinkage","noun","industry","棚卸減耗","Loss of inventory from theft, damage, or errors.","Shrinkage was higher than expected at three stores.","帳簿上の在庫と実際の在庫の差。盗難や破損、管理のミスなどが原因。","盗難、破損、誤りなどによる、在庫の減少。","棚卸減耗は、3店舗で想定を上回った。"],
["loyalty points","noun phrase","industry","ポイント(カスタマー・ロイヤルティ)","Rewards given to customers that can be redeemed for future purchases.","A contract liability is recorded for unredeemed loyalty points.","未使用のポイントは、将来の履行義務として、契約負債を計上する。","顧客に付与され、将来の購入に使うことができる特典。","未使用のポイントについて、契約負債が計上されている。"],
["gift card","noun phrase","industry","ギフトカード","A prepaid card that can be used to buy goods or services.","Revenue from gift cards is recognized when they are redeemed.","前受金として負債に計上し、使用された時点で収益を認識する。","商品やサービスの購入に使える、前払のカード。","ギフトカードからの収益は、利用されたときに認識される。"],
["markdown","noun","industry","値引き(売価の引下げ)","A reduction in the selling price of goods.","Markdowns were applied to slow-moving inventory.","売れ残った商品の売価を引き下げること。棚卸資産の評価に影響する。","商品の販売価格を、引き下げること。","動きの遅い在庫に、値引きが適用された。"],
["percentage of completion","noun phrase","industry","工事進行基準(進捗度)","A method of recognizing revenue based on the progress of a contract.","Revenue was recognized using the percentage of completion method.","建設業や受託開発で使う。進捗度の見積りが、監査上の主要な論点になる。","契約の進捗度に応じて、収益を認識する方法。","収益は、工事進行基準を用いて認識された。"],
["construction in progress","noun phrase","industry","建設仮勘定","Costs of assets under construction that are not yet in use.","Construction in progress is not depreciated until the asset is ready for use.","完成前の設備に対する支出。完成して使い始めてから、減価償却を始める。","まだ使用されていない、建設中の資産に係る支出。","建設仮勘定は、資産が使用可能になるまで、減価償却されない。"],
["investment property","noun phrase","industry","投資不動産","Property held to earn rent or for capital appreciation.","Investment property is measured at fair value.","賃貸収入や値上がり益を得るために保有する不動産。","賃貸収入または値上がり益を得るために保有する、不動産。","投資不動産は、公正価値で測定される。"],
["backlog","noun","industry","受注残高","The value of orders received but not yet fulfilled.","The backlog at year-end was 40 billion yen.","まだ売上として計上されていない、受注済みの金額。","受注したが、まだ履行されていない注文の金額。","期末の受注残高は、400億円だった。"],
["research and development costs","noun phrase","industry","研究開発費","Costs incurred in researching and developing new products or processes.","Research and development costs were expensed as incurred.","日本基準では、原則として発生時に費用処理する。IFRSでは、開発費の一部を資産計上する。","新しい製品やプロセスを研究・開発するために生じる、費用。","研究開発費は、発生時に費用処理された。"],
